<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMS Navigation Bar - Tailwind CSS & Font Awesome</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  </head>

  <body class="bg-gray-100">
    <!-- Header -->
    <header
      class="h-20 flex justify-between items-center shadow-md bg-white text-black p-4 fixed top-0 left-64 right-0 z-50"
    >
      <div class="flex items-center max-md:relative max-md:w-full">
        <h1 class="text-2xl font-semibold">Homepage</h1>
      </div>
      <div class="flex items-center relative h-full">
        <div
          id="userDropdown"
          class="h-full flex items-center mr-4 cursor-pointer"
        >
          <img
            src="./avatar.png"
            alt="User Avatar"
            class="h-10 w-10 rounded-full mr-2 bg-sky-500"
          />
          <div class="hidden md:block">
            <p class="text-xl">Nguyen Van A</p>
            <p class="text-sm">HR Department</p>
          </div>
        </div>

        <!-- Dropdown Menu -->
        <div
          id="dropdownMenu"
          class="absolute top-full right-0 w-48 bg-white divide-y divide-gray-100 rounded-md shadow-lg hidden"
        >
          <ul class="py-2 text-sm text-gray-700">
            <li>
              <a href="#" class="block px-4 py-2 hover:bg-gray-100">Account</a>
            </li>
            <li>
              <a href="#" class="block px-4 py-2 hover:bg-gray-100">Sign out</a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main class="flex">
      <aside
        class="flex flex-col h-full w-64 bg-[#121C3E] text-white fixed left-0 z-50"
        id="sidebar"
      >
        <div class="flex w-full mt-6 justify-center">
          <a href="#">
            <img src="./logo-ims.png" alt="IMS Logo" class="h-10" />
          </a>
        </div>
        <div class="flex flex-col mt-6" id="menu-items">
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-home text-2xl w-8 mr-2"></i>
            <span class="menu-text">Homepage</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-user text-2xl w-8 mr-2"></i>
            <span class="menu-text">Candidate</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-briefcase text-2xl w-8 mr-2"></i>
            <span class="menu-text">Job</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-calendar-alt text-2xl w-8 mr-2"></i>
            <span class="menu-text">Interview</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-file-alt text-2xl w-8 mr-2"></i>
            <span class="menu-text">Offer</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-users text-2xl w-8 mr-2"></i>
            <span class="menu-text">User</span>
          </a>
        </div>
        <div
          class="mt-auto flex justify-between items-center text-center border-t border-slate-400"
          id="menuBottom"
        >
          <a
            class="flex items-center grow w-full text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fa-solid fa-gear text-2xl w-8 mr-2"></i>
            <span class="menu-text">Settings</span>
          </a>
          <a
            id="toggleCollapse"
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black cursor-pointer"
            href="#"
          >
            <i
              id="collapseIcon"
              class="fa-solid fa-angles-left text-2xl w-8 mr-2"
            ></i>
          </a>
        </div>
      </aside>
      <!-- Main Content Area -->
      <div
        class="md:ml-64 ml-0 p-4 mt-16 transition-all duration-300 flex-1"
        id="mainContent"
      >
        <div class="container mx-auto">
          <!--Create, Update User-->
          <section class="bg-white dark:bg-gray-900">
            <div class="py-8 px-4 mx-auto max-w-5xl lg:py-16">
              <h2 class="mb-8 text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                Create User
              </h2>
              <form action="#">
                <div class="grid gap-4 sm:grid-cols-2 sm:gap-6">
                  <div class="sm:col-span-2">
                    <label
                      for="fullname"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Full Name <span class="text-red-500">*</span></label
                    >
                    <input
                      type="text"
                      id="fullname"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                      placeholder="Type a name..."
                      required=""
                    />
                  </div>
                  <div class="w-full">
                    <label
                      for="email"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Email <span class="text-red-500">*</span></label
                    >
                    <input
                      type="text"
                      id="email"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                      placeholder="Type a email..."
                      required=""
                    />
                  </div>
                  <div class="w-full">
                    <label
                      for="dob"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >DOB</label
                    >
                    <div class="relative">
                      <div
                        class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none"
                      >
                        <svg
                          class="w-4 h-4 text-gray-500 dark:text-gray-400"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          fill="currentColor"
                          viewBox="0 0 20 20"
                        >
                          <path
                            d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"
                          />
                        </svg>
                      </div>
                      <input
                        datepicker
                        id="dob"
                        type="text"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        placeholder="Select date"
                      />
                    </div>
                  </div>
                  <div class="w-full">
                    <label
                      for="address"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Address</label
                    >
                    <input
                      type="text"
                      id="address"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                      placeholder="Type an address..."
                      required=""
                    />
                  </div>
                  <div class="w-full">
                    <label
                      for="phonenumber"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Phone number</label
                    >
                    <input
                      type="text"
                      id="phonenumber"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                      placeholder="Type a number..."
                      required=""
                    />
                  </div>
                  <div class="w-full">
                    <label
                      for="gender"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Gender <span class="text-red-500">*</span></label
                    >
                    <select
                      id="gender"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    >
                      <option selected="">Select a gender</option>
                    </select>
                  </div>
                  <div class="w-full">
                    <label
                      for="role"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Roles <span class="text-red-500">*</span></label
                    >
                    <select
                      id="role"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    >
                      <option selected="">Select a position</option>
                    </select>
                  </div>
                  <div class="w-full">
                    <label
                      for="department"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Department <span class="text-red-500">*</span></label
                    >
                    <select
                      id="department"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    >
                      <option selected="">Select a department</option>
                    </select>
                  </div>
                  <div class="w-full">
                    <label
                      for="status"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Status <span class="text-red-500">*</span></label
                    >
                    <select
                      id="status"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    >
                      <option selected="">Select a status</option>
                    </select>
                  </div>
                  <div class="sm:col-span-2">
                    <label
                      for="note"
                      class="block mb-2 text-lg font-semibold text-gray-800 dark:text-gray-200"
                      >Note</label
                    >
                    <textarea
                      id="note"
                      rows="8"
                      class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-md border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                      placeholder="Type a note"
                    ></textarea>
                  </div>
                </div>
                <div class="flex justify-end mt-10 *:ml-5">
                  <button
                    class="px-6 py-3 text-white bg-blue-600 rounded-md hover:bg-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-300 cursor-pointer"
                  >
                    Submit
                  </button>
                  <button
                    class="px-6 py-3 text-white bg-red-500 rounded-md hover:bg-red-400 focus:outline-none focus:ring-4 focus:ring-red-300 cursor-pointer"
                  >
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const header = document.querySelector("header");
        const sidebar = document.getElementById("sidebar");
        const menuItems = document.getElementById("menu-items");
        const menuBottom = document.getElementById("menuBottom");
        const userDropdown = document.getElementById("userDropdown");
        const dropdownMenu = document.getElementById("dropdownMenu");
        const toggleCollapse = document.getElementById("toggleCollapse");
        const collapseIcon = document.getElementById("collapseIcon");
        const mainContent = document.getElementById("mainContent");
        const menuTexts = document.querySelectorAll(".menu-text");
        const menuBottomLinks = document.querySelectorAll("#menuBottom a");

        let sidebarCollapsed = false;

        function handleResize() {
          if (window.innerWidth < 768) {
            sidebarCollapsed = true;
            menuItems.classList.add("*:justify-center");
            sidebar.classList.remove("w-64");
            sidebar.classList.add("w-24");
            header.classList.remove("left-64");
            header.classList.add("left-24");
            collapseIcon.classList.remove("fa-angles-left");
            collapseIcon.classList.add("fa-angles-right");
            mainContent.classList.remove("md:ml-64");
            mainContent.classList.add("ml-24");
            menuBottom.classList.add("flex-col");

            menuBottomLinks.forEach((link) => {
              link.classList.add("w-full");
              link.classList.add("justify-center");
            });

            menuTexts.forEach((text) => {
              text.classList.add("hidden");
            });
          } else {
            sidebarCollapsed = false;
            menuItems.classList.remove("*:justify-center");
            sidebar.classList.add("w-64");
            sidebar.classList.remove("w-24");
            header.classList.add("left-64");
            header.classList.remove("left-24");
            collapseIcon.classList.add("fa-angles-left");
            collapseIcon.classList.remove("fa-angles-right");
            mainContent.classList.add("md:ml-64");
            mainContent.classList.remove("ml-24");
            menuBottom.classList.remove("flex-col");

            menuBottomLinks.forEach((link) => {
              link.classList.remove("w-full");
              link.classList.remove("justify-center");
            });
            menuTexts.forEach((text) => {
              text.classList.remove("hidden");
            });
          }
        }

        function toggleSidebar() {
          if (
            (!sidebarCollapsed && window.innerWidth >= 768) ||
            (!sidebarCollapsed && window.innerWidth < 768)
          ) {
            menuItems.classList.add("*:justify-center");
            sidebar.classList.remove("w-64");
            sidebar.classList.add("w-24");
            collapseIcon.classList.remove("fa-angles-left");
            collapseIcon.classList.add("fa-angles-right");
            mainContent.classList.remove("ml-64");
            mainContent.classList.add("ml-24");
            header.classList.remove("left-64");
            header.classList.add("left-24");
            menuBottomLinks.forEach((link) => {
              link.classList.add("w-full");
              link.classList.add("justify-center");
            });

            menuTexts.forEach((text) => {
              text.classList.add("hidden");
            });
          } else if (
            (sidebarCollapsed && window.innerWidth < 768) ||
            (sidebarCollapsed && window.innerWidth >= 768)
          ) {
            menuItems.classList.remove("*:justify-center");
            sidebar.classList.add("w-64");
            sidebar.classList.remove("w-24");
            collapseIcon.classList.add("fa-angles-left");
            collapseIcon.classList.remove("fa-angles-right");
            mainContent.classList.add("ml-64");
            mainContent.classList.remove("ml-24");
            header.classList.add("left-64");
            header.classList.remove("left-24");

            menuBottomLinks.forEach((link) => {
              link.classList.remove("w-full");
              link.classList.remove("justify-center");
            });
            menuTexts.forEach((text) => {
              text.classList.remove("hidden");
            });
          }
          sidebarCollapsed = !sidebarCollapsed;
          menuBottom.classList.toggle("flex-col");
        }

        handleResize();

        window.addEventListener("resize", handleResize);

        toggleCollapse.addEventListener("click", toggleSidebar);

        userDropdown.addEventListener("mouseenter", function () {
          dropdownMenu.classList.remove("hidden");
        });

        userDropdown.addEventListener("mouseleave", function () {
          setTimeout(() => {
            if (!dropdownMenu.matches(":hover")) {
              dropdownMenu.classList.add("hidden");
            }
          }, 200);
        });

        dropdownMenu.addEventListener("mouseleave", function () {
          dropdownMenu.classList.add("hidden");
        });
      });
    </script>
  </body>
</html>
