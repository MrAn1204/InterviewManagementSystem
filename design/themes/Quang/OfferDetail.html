<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offer Details</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1976d2", // màu xanh dương
              secondary: "#424242", // xám đậm
              // bạn có thể bổ sung thêm nếu cần
            },
            fontFamily: {
              sans: ["Roboto", "Open Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-gray-100">
    <!-- Header -->
    <header
      class="h-20 flex justify-between items-center shadow-md bg-white text-black p-4 fixed top-0 left-64 right-0 z-50"
    >
      <div class="flex items-center max-md:relative max-md:w-full">
        <h1 class="text-2xl font-semibold">Homepage</h1>
      </div>
      <div class="flex items-center relative h-full">
        <div
          id="userDropdown"
          class="h-full flex items-center mr-4 cursor-pointer"
        >
          <img
            src="./avatar.png"
            alt="User Avatar"
            class="h-10 w-10 rounded-full mr-2 bg-sky-500"
          />
          <div class="hidden md:block">
            <p class="text-xl">Nguyen Van A</p>
            <p class="text-sm">HR Department</p>
          </div>
        </div>

        <!-- Dropdown Menu -->
        <div
          id="dropdownMenu"
          class="absolute top-full right-0 w-48 bg-white divide-y divide-gray-100 rounded-lg shadow-lg hidden"
        >
          <ul class="py-2 text-sm text-gray-700">
            <li>
              <a href="#" class="block px-4 py-2 hover:bg-gray-100">Account</a>
            </li>
            <li>
              <a href="#" class="block px-4 py-2 hover:bg-gray-100">Sign out</a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main class="flex">
      <aside
        class="flex flex-col h-full w-64 bg-[#121C3E] text-white fixed left-0 z-50"
        id="sidebar"
      >
        <div class="flex w-full mt-6 justify-center">
          <a href="#">
            <img src="./logo-ims.png" alt="IMS Logo" class="h-10" />
          </a>
        </div>
        <div class="flex flex-col mt-6" id="menu-items">
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-home text-2xl w-8 mr-2"></i>
            <span class="menu-text">Homepage</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-user text-2xl w-8 mr-2"></i>
            <span class="menu-text">Candidate</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-briefcase text-2xl w-8 mr-2"></i>
            <span class="menu-text">Job</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-calendar-alt text-2xl w-8 mr-2"></i>
            <span class="menu-text">Interview</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-file-alt text-2xl w-8 mr-2"></i>
            <span class="menu-text">Offer</span>
          </a>
          <a
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fas fa-users text-2xl w-8 mr-2"></i>
            <span class="menu-text">User</span>
          </a>
        </div>
        <div
          class="mt-auto flex justify-between items-center text-center border-t border-slate-400"
          id="menuBottom"
        >
          <a
            class="flex items-center grow w-full text-center p-4 hover:bg-[#FFC20E] hover:text-black"
            href="#"
          >
            <i class="fa-solid fa-gear text-2xl w-8 mr-2"></i>
            <span class="menu-text">Settings</span>
          </a>
          <a
            id="toggleCollapse"
            class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black cursor-pointer"
            href="#"
          >
            <i
              id="collapseIcon"
              class="fa-solid fa-angles-left text-2xl w-8 mr-2"
            ></i>
          </a>
        </div>
      </aside>
      <!-- Main Content Area -->
      <div
        class="md:ml-64 ml-0 p-4 mt-16 grow transition-all duration-300"
        id="mainContent"
      >
        <div class="container mx-auto max-w-screen-xl py-8 px-4">
          <!-- Tiêu đề -->
          <h1 class="text-4xl font-semibold mb-8">
            <i class="fas fa-file-alt text-primary mr-2"></i>
            Offer Detail
          </h1>

          <!-- Breadcrumb -->
          <div class="pb-8 flex items-center justify-between">
            <!-- Bên trái: Đường dẫn -->
            <div>
              <a class="text-xl text-primary hover:underline" href=""
                >Offer List</a
              >
              >
              <a class="text-xl text-primary hover:underline" href=""
                >Offer Detail</a
              >
            </div>
            <!-- Bên phải: thông tin Created/Updated nếu muốn -->
            <div class="text-sm text-gray-500">
              <p>Created at: 2023-12-01</p>
              <p>Last updated: 2023-12-05</p>
            </div>
          </div>

          <!-- Card bao quanh form -->
          <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
            <!-- Phần I: Offer information -->
            <h2 class="text-2xl font-semibold mb-4">Offer information</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Candidate (chỉ đọc) -->
              <div class="md:col-span-2">
                <label for="candidate" class="block text-sm font-medium mb-1">
                  <i class="fas fa-user mr-1"></i>Candidate
                </label>
                <input
                  type="text"
                  id="candidate"
                  name="candidate"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="John Doe"
                />
              </div>

              <!-- Position (chỉ đọc) -->
              <div>
                <label for="position" class="block text-sm font-medium mb-1">
                  <i class="fas fa-briefcase mr-1"></i>Position
                </label>
                <input
                  type="text"
                  id="position"
                  name="position"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Software Engineer"
                />
              </div>

              <!-- Approver (chỉ đọc) -->
              <div>
                <label for="approver" class="block text-sm font-medium mb-1">
                  <i class="fas fa-user-check mr-1"></i>Approver
                </label>
                <input
                  type="text"
                  id="approver"
                  name="approver"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Jane Smith"
                />
              </div>

              <!-- Interview Info (chỉ đọc) -->
              <div class="md:col-span-2">
                <label for="interview" class="block text-sm font-medium mb-1">
                  <i class="fas fa-calendar-check mr-1"></i>Interview Info
                </label>
                <input
                  type="text"
                  id="interview"
                  name="interview"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Technical Interview - 2023/12/05"
                />
              </div>

              <!-- Contract Period (chỉ đọc) -->
              <div class="md:col-span-2">
                <label
                  for="contractPeriod"
                  class="block text-sm font-medium mb-1"
                >
                  <i class="fas fa-calendar-alt mr-1"></i>Contract Period
                </label>
                <input
                  type="text"
                  id="contractPeriod"
                  name="contractPeriod"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="2023/12/10 - 2024/12/10"
                />
              </div>

              <!-- Contract Type (chỉ đọc) -->
              <div>
                <label
                  for="contractType"
                  class="block text-sm font-medium mb-1"
                >
                  <i class="fas fa-file-contract mr-1"></i>Contract Type
                </label>
                <input
                  type="text"
                  id="contractType"
                  name="contractType"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Full-time"
                />
              </div>

              <!-- Level (chỉ đọc) -->
              <div>
                <label for="level" class="block text-sm font-medium mb-1">
                  <i class="fas fa-layer-group mr-1"></i>Level
                </label>
                <input
                  type="text"
                  id="level"
                  name="level"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Senior"
                />
              </div>

              <!-- Department (chỉ đọc) -->
              <div>
                <label for="department" class="block text-sm font-medium mb-1">
                  <i class="fas fa-building mr-1"></i>Department
                </label>
                <input
                  type="text"
                  id="department"
                  name="department"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="IT"
                />
              </div>

              <!-- Recruiter Owner (chỉ đọc) -->
              <div>
                <label for="recruiter" class="block text-sm font-medium mb-1">
                  <i class="fas fa-user-tie mr-1"></i>Recruiter Owner
                </label>
                <input
                  type="text"
                  id="recruiter"
                  name="recruiter"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Michael Johnson"
                />
              </div>

              <!-- Due Date (chỉ đọc) -->
              <div>
                <label for="dueDate" class="block text-sm font-medium mb-1">
                  <i class="fas fa-clock mr-1"></i>Due Date
                </label>
                <input
                  type="text"
                  id="dueDate"
                  name="dueDate"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="2023/12/15"
                />
              </div>

              <!-- Basic Salary (chỉ đọc) -->
              <div>
                <label for="salary" class="block text-sm font-medium mb-1">
                  <i class="fas fa-dollar-sign mr-1"></i>Basic Salary
                </label>
                <input
                  type="text"
                  id="salary"
                  name="salary"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="2000$"
                />
              </div>

              <!-- Status (chỉ đọc) -->
              <div>
                <label for="status" class="block text-sm font-medium mb-1">
                  <i class="fas fa-info-circle mr-1"></i>Status
                </label>
                <input
                  type="text"
                  id="status"
                  name="status"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                  value="Waiting for approval"
                />
              </div>

              <!-- Note (chỉ đọc) -->
              <div class="md:col-span-2">
                <label for="note" class="block text-sm font-medium mb-1">
                  <i class="fas fa-sticky-note mr-1"></i>Note
                </label>
                <textarea
                  id="note"
                  name="note"
                  rows="3"
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                  readonly
                >
Offer valid until the due date. Contact HR for more details.</textarea
                >
              </div>
            </div>

            <!-- Action buttons -->
            <div class="mt-8 flex justify-end">
              <!-- Approve -->
              <button
                type="button"
                class="mr-4 bg-green-600 text-white font-semibold py-2 px-6 rounded-md hover:bg-green-500"
              >
                <i class="fas fa-check mr-2"></i>Approve
              </button>
              <!-- Reject -->
              <button
                type="button"
                class="mr-4 bg-yellow-400 text-white font-semibold py-2 px-6 rounded-md hover:bg-yellow-300"
              >
                <i class="fas fa-times mr-2"></i>Reject
              </button>
              <!-- Edit -->
              <button
                type="button"
                class="mr-4 bg-primary text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]"
              >
                <i class="fas fa-edit mr-2"></i>Edit
              </button>
              <!-- Back -->
              <button
                type="button"
                class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]"
              >
                <i class="fas fa-arrow-left mr-2"></i>Back
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const header = document.querySelector("header");
        const sidebar = document.getElementById("sidebar");
        const menuItems = document.getElementById("menu-items");
        const menuBottom = document.getElementById("menuBottom");
        const userDropdown = document.getElementById("userDropdown");
        const dropdownMenu = document.getElementById("dropdownMenu");
        const toggleCollapse = document.getElementById("toggleCollapse");
        const collapseIcon = document.getElementById("collapseIcon");
        const mainContent = document.getElementById("mainContent");
        const menuTexts = document.querySelectorAll(".menu-text");
        const menuBottomLinks = document.querySelectorAll("#menuBottom a");

        let sidebarCollapsed = false;

        function handleResize() {
          if (window.innerWidth < 768) {
            sidebarCollapsed = true;
            menuItems.classList.add("*:justify-center");
            sidebar.classList.remove("w-64");
            sidebar.classList.add("w-24");
            header.classList.remove("left-64");
            header.classList.add("left-24");
            collapseIcon.classList.remove("fa-angles-left");
            collapseIcon.classList.add("fa-angles-right");
            mainContent.classList.remove("md:ml-64");
            mainContent.classList.add("ml-24");
            menuBottom.classList.add("flex-col");

            menuBottomLinks.forEach((link) => {
              link.classList.add("w-full");
              link.classList.add("justify-center");
            });

            menuTexts.forEach((text) => {
              text.classList.add("hidden");
            });
          } else {
            sidebarCollapsed = false;
            menuItems.classList.remove("*:justify-center");
            sidebar.classList.add("w-64");
            sidebar.classList.remove("w-24");
            header.classList.add("left-64");
            header.classList.remove("left-24");
            collapseIcon.classList.add("fa-angles-left");
            collapseIcon.classList.remove("fa-angles-right");
            mainContent.classList.add("md:ml-64");
            mainContent.classList.remove("ml-24");
            menuBottom.classList.remove("flex-col");

            menuBottomLinks.forEach((link) => {
              link.classList.remove("w-full");
              link.classList.remove("justify-center");
            });
            menuTexts.forEach((text) => {
              text.classList.remove("hidden");
            });
          }
        }

        function toggleSidebar() {
          if (
            (!sidebarCollapsed && window.innerWidth >= 768) ||
            (!sidebarCollapsed && window.innerWidth < 768)
          ) {
            menuItems.classList.add("*:justify-center");
            sidebar.classList.remove("w-64");
            sidebar.classList.add("w-24");
            collapseIcon.classList.remove("fa-angles-left");
            collapseIcon.classList.add("fa-angles-right");
            mainContent.classList.remove("ml-64");
            mainContent.classList.add("ml-24");
            header.classList.remove("left-64");
            header.classList.add("left-24");
            menuBottomLinks.forEach((link) => {
              link.classList.add("w-full");
              link.classList.add("justify-center");
            });

            menuTexts.forEach((text) => {
              text.classList.add("hidden");
            });
          } else if (
            (sidebarCollapsed && window.innerWidth < 768) ||
            (sidebarCollapsed && window.innerWidth >= 768)
          ) {
            menuItems.classList.remove("*:justify-center");
            sidebar.classList.add("w-64");
            sidebar.classList.remove("w-24");
            collapseIcon.classList.add("fa-angles-left");
            collapseIcon.classList.remove("fa-angles-right");
            mainContent.classList.add("ml-64");
            mainContent.classList.remove("ml-24");
            header.classList.add("left-64");
            header.classList.remove("left-24");

            menuBottomLinks.forEach((link) => {
              link.classList.remove("w-full");
              link.classList.remove("justify-center");
            });
            menuTexts.forEach((text) => {
              text.classList.remove("hidden");
            });
          }
          sidebarCollapsed = !sidebarCollapsed;
          menuBottom.classList.toggle("flex-col");
        }

        handleResize();

        window.addEventListener("resize", handleResize);

        toggleCollapse.addEventListener("click", toggleSidebar);

        userDropdown.addEventListener("mouseenter", function () {
          dropdownMenu.classList.remove("hidden");
        });

        userDropdown.addEventListener("mouseleave", function () {
          setTimeout(() => {
            if (!dropdownMenu.matches(":hover")) {
              dropdownMenu.classList.add("hidden");
            }
          }, 200);
        });

        dropdownMenu.addEventListener("mouseleave", function () {
          dropdownMenu.classList.add("hidden");
        });
      });
    </script>
  </body>
</html>
