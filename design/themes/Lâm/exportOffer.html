<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Offer Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <!-- Header -->
  <header
    class="h-20 flex justify-between items-center shadow-md bg-white text-black p-4 fixed top-0 left-64 right-0 z-50">
    <div class="flex items-center max-md:relative max-md:w-full">
      <h1 class="text-2xl font-semibold">
        Homepage
      </h1>
    </div>
    <div class="flex items-center relative h-full">
      <div id="userDropdown" class="h-full flex items-center mr-4 cursor-pointer">
        <img src="./avatar.png" alt="User Avatar" class="h-10 w-10 rounded-full mr-2 bg-sky-500">
        <div class="hidden md:block">
          <p class="text-xl">Nguyen Van A</p>
          <p class="text-sm">HR Department</p>
        </div>
      </div>

      <!-- Dropdown Menu -->
      <div id="dropdownMenu"
        class="absolute top-full left-0 w-44 bg-white divide-y divide-gray-100 rounded-lg shadow-lg hidden">
        <ul class="py-2 text-sm text-gray-700">
          <li>
            <a href="#" class="block px-4 py-2 hover:bg-gray-100">Account</a>
          </li>
          <li>
            <a href="#" class="block px-4 py-2 hover:bg-gray-100">Sign out</a>
          </li>
        </ul>
      </div>
    </div>
  </header>
  <!-- Export Button -->
  <main class="flex">
    <aside class="flex flex-col h-full w-64 bg-[#121C3E] text-white fixed left-0 z-50" id="sidebar">
      <div class="flex w-full mt-6 justify-center">
        <a href="#">
          <img src="./logo-ims.png" alt="IMS Logo" class="h-10">
        </a>
      </div>
      <div class="flex flex-col mt-6" id="menu-items">
        <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fas fa-home text-2xl w-8 mr-2"></i>
          <span class="menu-text">Homepage</span>
        </a>
        <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fas fa-user text-2xl w-8 mr-2"></i>
          <span class="menu-text">Candidate</span>
        </a>
        <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fas fa-briefcase text-2xl w-8 mr-2"></i>
          <span class="menu-text">Job</span>
        </a>
        <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fas fa-calendar-alt text-2xl w-8 mr-2"></i>
          <span class="menu-text">Interview</span>
        </a>
        <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fas fa-file-alt text-2xl w-8 mr-2"></i>
          <span class="menu-text">Offer</span>
        </a>
        <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fas fa-users text-2xl w-8 mr-2"></i>
          <span class="menu-text">User</span>
        </a>
      </div>
      <div class="mt-auto flex justify-between items-center text-center border-t border-slate-400" id="menuBottom">
        <a class="flex items-center grow w-full text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
          <i class="fa-solid fa-gear text-2xl w-8 mr-2"></i>
          <span class="menu-text">Settings</span>
        </a>
        <a id="toggleCollapse"
          class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black cursor-pointer" href="#">
          <i id="collapseIcon" class="fa-solid fa-angles-left text-2xl w-8 mr-2"></i>
        </a>
      </div>
    </aside>
    <!-- Main Content Area -->
    <div class="ml-64 ml-0 p-4 mt-20 grow transition-all duration-300" id="mainContent">
      <div class="container mx-auto *:text-sm">
        <button id="open-modal" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded transition">
          Export
        </button>

        <!-- Modal -->
        <div id="export-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
          <div class="bg-white rounded-lg shadow-md p-6 w-full max-w-md relative">
            <h2 class="text-2xl text-center font-semibold text-gray-800 mb-4">Export Offer</h2>

            <!-- Close Button -->
            <button id="close-modal" class="absolute top-2 right-2 text-gray-500 hover:text-red-500 text-xl">
              &times;
            </button>

            <div class="space-y-4">
              <!-- Start Date and Time -->
              <div>
                <label class="block font-medium text-gray-700 mb-1" for="start-date">Thời gian bắt đầu</label>
                <div class="flex space-x-2">
                  <div class="relative flex-1">
                    <input title="start-date" type="date" id="start-date"
                      class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                  </div>
                  <div class="relative flex-1">
                    <input title="start-time" type="time" id="start-time"
                      class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                  </div>
                </div>
              </div>

              <!-- End Date and Time -->
              <div>
                <label class="block font-medium text-gray-700 mb-1" for="end-date">Thời gian kết thúc</label>
                <div class="flex space-x-2">
                  <div class="relative flex-1">
                    <input title="end-date" type="date" id="end-date"
                      class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                  </div>
                  <div class="relative flex-1">
                    <input title="end-time" type="time" id="end-time"
                      class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                  </div>
                </div>
              </div>

              <!-- Selected Range Display -->
              <div class="mt-4 p-3 bg-blue-50 rounded-md">
                <p class="text-blue-800">
                  <span class="font-medium">Khoảng thời gian đã chọn:</span>
                  <span id="selected-range">Chưa chọn</span>
                </p>
              </div>

              <!-- Submit & Cancel Buttons -->
              <div class="flex justify-center mt-2 space-x-4">
                <button id="submit-button"
                  class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded transition">
                  Submit
                </button>
                <button id="cancel-button" class="bg-gray-300 text-black px-4 py-2 rounded hover:bg-gray-400">
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const modal = document.getElementById('export-modal');
      const openModalBtn = document.getElementById('open-modal');
      const closeModalBtn = document.getElementById('close-modal');
      const cancelBtn = document.getElementById('cancel-button');
      const header = document.querySelector("header");
      const sidebar = document.getElementById('sidebar');
      const menuItems = document.getElementById("menu-items");
      const menuBottom = document.getElementById("menuBottom");
      const userDropdown = document.getElementById("userDropdown");
      const dropdownMenu = document.getElementById("dropdownMenu");
      const toggleCollapse = document.getElementById("toggleCollapse");
      const collapseIcon = document.getElementById("collapseIcon");
      const mainContent = document.getElementById("mainContent");
      const menuTexts = document.querySelectorAll(".menu-text");
      const menuBottomLinks = document.querySelectorAll("#menuBottom a");

      let sidebarCollapsed = false;

      function handleResize() {
        if (window.innerWidth < 768) {
          sidebarCollapsed = true;
          menuItems.classList.add('*:justify-center');
          sidebar.classList.remove('w-64');
          sidebar.classList.add('w-24');
          header.classList.remove('left-64');
          header.classList.add('left-24');
          collapseIcon.classList.remove('fa-angles-left');
          collapseIcon.classList.add('fa-angles-right');
          mainContent.classList.remove('ml-64');
          mainContent.classList.add('ml-24');
          menuBottom.classList.add('flex-col');

          menuBottomLinks.forEach(link => {
            link.classList.add('w-full');
            link.classList.add('justify-center');
          });

          menuTexts.forEach(text => {
            text.classList.add('hidden');
          });
        } else {
          sidebarCollapsed = false;
          menuItems.classList.remove('*:justify-center');
          sidebar.classList.add('w-64');
          sidebar.classList.remove('w-24');
          header.classList.add('left-64');
          header.classList.remove('left-24');
          collapseIcon.classList.add('fa-angles-left');
          collapseIcon.classList.remove('fa-angles-right');
          mainContent.classList.add('ml-64');
          mainContent.classList.remove('ml-24');
          menuBottom.classList.remove('flex-col');

          menuBottomLinks.forEach(link => {
            link.classList.remove('w-full');
            link.classList.remove('justify-center');
          });
          menuTexts.forEach(text => {
            text.classList.remove('hidden');
          });
        }
      }

      function toggleSidebar() {

        if (!sidebarCollapsed && window.innerWidth >= 768 || !sidebarCollapsed && window.innerWidth < 768) {
          menuItems.classList.add('*:justify-center');
          sidebar.classList.remove('w-64');
          sidebar.classList.add('w-24');
          collapseIcon.classList.remove('fa-angles-left');
          collapseIcon.classList.add('fa-angles-right');
          mainContent.classList.remove('ml-64');
          mainContent.classList.add('ml-24');
          header.classList.remove('left-64');
          header.classList.add('left-24');
          menuBottomLinks.forEach(link => {
            link.classList.add('w-full');
            link.classList.add('justify-center');
          });

          menuTexts.forEach(text => {
            text.classList.add('hidden');
          });
        } else if (sidebarCollapsed && window.innerWidth < 768 || sidebarCollapsed && window.innerWidth >= 768) {
          menuItems.classList.remove('*:justify-center');
          sidebar.classList.add('w-64');
          sidebar.classList.remove('w-24');
          collapseIcon.classList.add('fa-angles-left');
          collapseIcon.classList.remove('fa-angles-right');
          mainContent.classList.add('ml-64');
          mainContent.classList.remove('ml-24');
          header.classList.add('left-64');
          header.classList.remove('left-24');

          menuBottomLinks.forEach(link => {
            link.classList.remove('w-full');
            link.classList.remove('justify-center');
          });
          menuTexts.forEach(text => {
            text.classList.remove('hidden');
          });
        }
        sidebarCollapsed = !sidebarCollapsed;
        menuBottom.classList.toggle('flex-col');
      }

      handleResize();

      window.addEventListener('resize', handleResize);

      toggleCollapse.addEventListener('click', toggleSidebar);

      userDropdown.addEventListener("mouseenter", function () {
        dropdownMenu.classList.remove("hidden");
      });

      userDropdown.addEventListener("mouseleave", function () {
        setTimeout(() => {
          if (!dropdownMenu.matches(":hover")) {
            dropdownMenu.classList.add("hidden");
          }
        }, 200);
      });

      dropdownMenu.addEventListener("mouseleave", function () {
        dropdownMenu.classList.add("hidden");
      });

      // Hiển thị modal
      openModalBtn.addEventListener('click', function () {
        modal.classList.remove('hidden');
      });

      // Đóng modal khi nhấn nút X hoặc Cancel
      closeModalBtn.addEventListener('click', function () {
        modal.classList.add('hidden');
      });

      cancelBtn.addEventListener('click', function () {
        modal.classList.add('hidden');
      });

      const now = new Date();
      const today = now.toISOString().split('T')[0];

      const formatTime = (date) => {
        return date.toTimeString().slice(0, 5);
      };


      document.getElementById('start-date').value = today;
      document.getElementById('start-time').value = '00:00';
      document.getElementById('end-date').value = today;
      document.getElementById('end-time').value = formatTime(now);

      updateSelectedRangeDisplay();

      // Đóng modal khi click bên ngoài
      window.addEventListener('click', function (event) {
        if (event.target === modal) {
          modal.classList.add('hidden');
        }
      });

      function updateSelectedRangeDisplay() {
        const startDate = document.getElementById('start-date').value;
        const startTime = document.getElementById('start-time').value;
        const endDate = document.getElementById('end-date').value;
        const endTime = document.getElementById('end-time').value;

        if (startDate && startTime && endDate && endTime) {
          const displayText = `${formatDateTimeForDisplay(startDate, startTime)} - ${formatDateTimeForDisplay(endDate, endTime)}`;
          document.getElementById('selected-range').textContent = displayText;
        } else {
          document.getElementById('selected-range').textContent = 'Chưa chọn';
        }
      }

      function formatDateTimeForDisplay(dateStr, timeStr) {
        const date = new Date(`${dateStr}T${timeStr}`);

        const day = date.getDate().toString().padStart(2, '0');
        const month = (date.getMonth() + 1).toString().padStart(2, '0');
        const year = date.getFullYear();
        const hours = date.getHours().toString().padStart(2, '0');
        const minutes = date.getMinutes().toString().padStart(2, '0');

        return `${day}/${month}/${year} ${hours}:${minutes}`;
      }

      document.getElementById('start-date').addEventListener('change', updateSelectedRangeDisplay);
      document.getElementById('start-time').addEventListener('change', updateSelectedRangeDisplay);
      document.getElementById('end-date').addEventListener('change', updateSelectedRangeDisplay);
      document.getElementById('end-time').addEventListener('change', updateSelectedRangeDisplay);

      document.getElementById('submit-button').addEventListener('click', function () {
        const startDate = document.getElementById('start-date').value;
        const startTime = document.getElementById('start-time').value;
        const endDate = document.getElementById('end-date').value;
        const endTime = document.getElementById('end-time').value;

        alert(`Đã chọn khoảng thời gian:\nBắt đầu: ${formatDateTimeForDisplay(startDate, startTime)}\nKết thúc: ${formatDateTimeForDisplay(endDate, endTime)}`);
      });
    });
  </script>
</body>

</html>
