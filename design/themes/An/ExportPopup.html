<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Popup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1976d2",
            secondary: "#424242",
          },
          fontFamily: {
            sans: ["Roboto", "Open Sans", "sans-serif"],
          },
        },
      },
    };
  </script>
</head>

<body class="flex items-center justify-center h-screen bg-gray-100">

  <!-- Button to open popup -->
  <button onclick="openPopup()" class="bg-blue-500 text-white px-4 py-2 rounded-md">Show Popup</button>

  <!-- Popup Modal -->
  <div id="popupModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
    <form class="flex flex-col space-y-8 bg-white w-96 p-8 rounded-lg shadow-lg text-center">
      <div>
        <i class="fa-solid fa-file-export text-4xl text-green-500"></i>
        <p class="text-2xl block font-semibold mb-1">Export offer</p>
      </div>

      <div class="flex flex-col md:flex-row md:justify-between *:text-left *:w-full gap-4">
        <div class="flex flex-col flex-1 min-w-0">
          <span class="block text-lg font-semibold mb-1">From</span>
          <input type="date" id="from" name="from"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>
      
        <div class="flex flex-col flex-1 min-w-0">
          <span class="block text-lg font-semibold mb-1">To</span>
          <input type="date" id="to" name="to"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>
      </div>      
      
      <div class="modal-buttons flex flex-wrap *:w-2/5 justify-evenly">
        <button onclick="closePopup()"
          class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">Cancel</button>
        <button type="submit" onclick="closePopup()"
          class="mr-4 bg-primary text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">Export</button>
      </div>
    </form>
  </div>

  <script>
    function openPopup() {
      document.getElementById("popupModal").classList.remove("hidden");
    }

    function closePopup() {
      document.getElementById("popupModal").classList.add("hidden");
    }
  </script>

</body>

</html>
