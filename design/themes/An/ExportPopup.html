<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Popup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="flex items-center justify-center h-screen bg-gray-100">

    <!-- Button to open popup -->
    <button onclick="openPopup()" class="bg-blue-500 text-white px-4 py-2 rounded-md">Show Popup</button>

    <!-- Popup Modal -->
    <div id="popupModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
        <form class="flex flex-col gap-8 bg-white w-96 p-6 rounded-lg shadow-lg text-center">
            <div>
                <i class="fa-solid fa-file-export text-4xl text-green-500"></i>
                <p class="text-2xl break-words">Export offer</p>
            </div>
            <div class="flex flex-col md:flex-row md:justify-between *:text-left *:w-full md:space-x-4">
                <div>
                    <span>From</span>
                    <input type="date" id="export-from" name="exportFrom"
                        class="focus:ring-blue-500 focus:border-blue-500 block w-full border-gray-300 rounded-md p-2 border"
                        required>
                </div>
                <div>
                    <span>To</span>
                    <input type="date" id="export-to" name="exportTo"
                        class="focus:ring-blue-500 focus:border-blue-500 block w-full border-gray-300 rounded-md p-2 border"
                        required>
                </div>
            </div>
            <div class="modal-buttons flex flex-wrap *:w-2/5 justify-evenly">
                <button onclick="closePopup()"
                    class="bg-gray-400 text-white font-bold py-2 rounded-md hover:bg-gray-600 text-center">Cancel</button>
                <button type="submit" onclick="closePopup()"
                    class="bg-blue-500 text-white font-bold py-2 rounded-md hover:bg-blue-700">Export</button>
            </div>
        </form>
    </div>

    <script>
        function openPopup() {
            document.getElementById("popupModal").classList.remove("hidden");
        }

        function closePopup() {
            document.getElementById("popupModal").classList.add("hidden");
        }
    </script>

</body>

</html>
