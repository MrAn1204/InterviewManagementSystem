<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Create form </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1976d2',    // màu xanh dương
                        secondary: '#424242', // xám đậm
                        // bạn có thể bổ sung thêm nếu cần
                    },
                    fontFamily: {
                        sans: ['Roboto', 'Open Sans', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-gray-100">
    <!-- Header -->
    <header
        class="h-20 flex justify-between items-center shadow-md bg-white text-black p-4 fixed top-0 left-64 right-0 z-50">
        <div class="flex items-center max-md:relative max-md:w-full">
            <h1 class="text-2xl font-semibold">
                Homepage
            </h1>
        </div>
        <div class="flex items-center relative h-full">
            <div id="userDropdown" class="h-full flex items-center mr-4 cursor-pointer">
                <img src="./avatar.png" alt="User Avatar" class="h-10 w-10 rounded-full mr-2 bg-sky-500">
                <div class="hidden md:block">
                    <p class="text-xl">Nguyen Van A</p>
                    <p class="text-sm">HR Department</p>
                </div>
            </div>

            <!-- Dropdown Menu -->
            <div id="dropdownMenu"
                class="absolute top-full right-0 w-48 bg-white divide-y divide-gray-100 rounded-lg shadow-lg hidden">
                <ul class="py-2 text-sm text-gray-700">
                    <li>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Account</a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Sign out</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="flex">
        <aside class="flex flex-col h-full w-64 bg-[#121C3E] text-white fixed left-0 z-50" id="sidebar">
            <div class="flex w-full mt-6 justify-center">
                <a href="#">
                    <img src="./logo-ims.png" alt="IMS Logo" class="h-10">
                </a>
            </div>
            <div class="flex flex-col mt-6" id="menu-items">
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-home text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Homepage</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-user text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Candidate</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-briefcase text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Job</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-calendar-alt text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Interview</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-file-alt text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Offer</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-users text-2xl w-8 mr-2"></i>
                    <span class="menu-text">User</span>
                </a>
            </div>
            <div class="mt-auto flex justify-between items-center text-center border-t border-slate-400"
                id="menuBottom">
                <a class="flex items-center grow w-full text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fa-solid fa-gear text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Settings</span>
                </a>
                <a id="toggleCollapse"
                    class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black cursor-pointer"
                    href="#">
                    <i id="collapseIcon" class="fa-solid fa-angles-left text-2xl w-8 mr-2"></i>
                </a>
            </div>
        </aside>
        <!-- Main Content Area -->
        <div class="md:ml-64 ml-0 p-4 mt-16 grow transition-all duration-300" id="mainContent">
            <div class="container mx-auto max-w-screen-xl py-8 px-4">
                <!-- Tiêu đề -->
                <h1 class="text-4xl font-semibold mb-8">
                    <i class="fas fa-calendar-plus text-primary mr-2"></i>
                    New Interview Schedule
                </h1>

                <!-- Breadcrumb -->
                <div class="pb-8">
                    <a class="text-xl text-primary hover:underline" href="">Interview Schedule List</a>
                    >
                    <a class="text-xl text-primary hover:underline" href="">New Interview Schedule</a>
                </div>

                <!-- Card bao quanh form -->
                <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
                    <!-- Phần I: Schedule information -->
                    <h2 class="text-2xl font-semibold mb-4">Schedule Information</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Schedule Title -->
                        <div>
                            <label for="scheduleTitle" class="block text-sm font-medium mb-1">
                                <i class="fas fa-file-alt mr-1"></i>Schedule title
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="scheduleTitle" name="scheduleTitle" placeholder="Type a title..."
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>

                        <!-- Candidate name -->
                        <div>
                            <label for="candidateName" class="block text-sm font-medium mb-1">
                                <i class="fas fa-user mr-1"></i>Candidate name
                                <span class="text-red-500">*</span>
                            </label>
                            <select id="candidateName" name="candidateName"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="">Select candidate...</option>
                                <option value="c1">John Doe</option>
                                <option value="c2">Jane Smith</option>
                                <option value="c3">Michael Lee</option>
                                <!-- ... -->
                            </select>
                        </div>

                        <!-- Schedule Time -->
                        <div>
                            <label for="scheduleTime" class="block text-sm font-medium mb-1">
                                <i class="fas fa-clock mr-1"></i>Schedule Time
                                <span class="text-red-500">*</span>
                            </label>
                            <!-- datetime-local cho ngày/giờ -->
                            <input type="datetime-local" id="scheduleTime" name="scheduleTime"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>

                        <!-- Job -->
                        <div>
                            <label for="job" class="block text-sm font-medium mb-1">
                                <i class="fas fa-briefcase mr-1"></i>Job
                                <span class="text-red-500">*</span>
                            </label>
                            <select id="job" name="job"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
                                <option value="">Select a job...</option>
                                <option value="j1">Backend Developer</option>
                                <option value="j2">Frontend Developer</option>
                                <option value="j3">QA Engineer</option>
                                <!-- ... -->
                            </select>
                        </div>

                        <!-- Interviewer (multi-select dropdown) -->
                        <div class="relative" id="interviewer-wrapper">
                            <label class="block text-sm font-medium mb-1">
                                <i class="fas fa-users mr-1"></i>Interviewer
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="interviewerInput"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer"
                                placeholder="Click to select interviewer(s)" readonly />
                            <!-- Dropdown -->
                            <div id="interviewerDropdown"
                                class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg hidden">
                                <div class="p-2 max-h-48 overflow-y-auto">
                                    <label class="flex items-center mb-1 cursor-pointer">
                                        <input type="checkbox" value="Thiệu P" class="mr-2"
                                            onclick="updateInterviewerSelected()" />
                                        Thiệu P
                                    </label>
                                    <label class="flex items-center mb-1 cursor-pointer">
                                        <input type="checkbox" value="Name B" class="mr-2"
                                            onclick="updateInterviewerSelected()" />
                                        Name B
                                    </label>
                                    <label class="flex items-center mb-1 cursor-pointer">
                                        <input type="checkbox" value="John H" class="mr-2"
                                            onclick="updateInterviewerSelected()" />
                                        John H
                                    </label>
                                    <!-- ... -->
                                </div>
                            </div>
                            <small class="text-gray-500">
                                Click vào ô để mở danh sách. Tích chọn nhiều interviewer nếu cần.
                            </small>
                            <input type="hidden" name="interviewer" id="interviewerHidden" />
                        </div>

                        <!-- Location -->
                        <div>
                            <label for="location" class="block text-sm font-medium mb-1">
                                <i class="fas fa-map-marker-alt mr-1"></i>Location
                            </label>
                            <input type="text" id="location" name="location" placeholder="Type a location"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>

                        <!-- Recruiter owner -->
                        <div>
                            <label for="recruiterOwner" class="block text-sm font-medium mb-1">
                                <i class="fas fa-user-tie mr-1"></i>Recruiter owner
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="recruiterOwner" name="recruiterOwner" placeholder="Recruiter name"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                            <a class="text-xs text-primary hover:underline" href="">
                                <i><u>Assign me</u></i>
                            </a>
                        </div>

                        <!-- Meeting ID -->
                        <div>
                            <label for="meetingID" class="block text-sm font-medium mb-1">
                                <i class="fas fa-link mr-1"></i>Meeting ID
                            </label>
                            <input type="text" id="meetingID" name="meetingID" placeholder="meet.google.com/xyz-abc"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                        <!-- Notes -->
                        <div>
                            <label for="notes" class="block text-sm font-medium mb-1">
                                <i class="fas fa-sticky-note mr-1"></i>Notes
                            </label>
                            <input type="text" id="notes" name="notes" placeholder="Type schedule note..."
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
                        </div>
                    </div>

                    <!-- Nút Submit/Cancel -->
                    <div class="mt-8 flex justify-end">
                        <!-- Submit -->
                        <button type="submit"
                            class="mr-4 bg-primary text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
                            <i class="fas fa-check mr-2"></i>Submit
                        </button>
                        <!-- Cancel -->
                        <button type="button"
                            class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
                            <i class="fas fa-times mr-2"></i>Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const interviewerInput = document.getElementById('interviewerInput');
        const interviewerDropdown = document.getElementById('interviewerDropdown');
        const interviewerHidden = document.getElementById('interviewerHidden');

        interviewerInput.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown(interviewerDropdown);
        });

        document.addEventListener('click', (e) => {
            // Nếu click ngoài vùng interviewer-wrapper => ẩn dropdown
            if (!document.getElementById('interviewer-wrapper')?.contains(e.target)) {
                interviewerDropdown.classList.add('hidden');
            }
        });

        function toggleDropdown(dropdown) {
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
            } else {
                dropdown.classList.add('hidden');
            }
        }

        function updateInterviewerSelected() {
            const checkboxes = interviewerDropdown.querySelectorAll('input[type="checkbox"]');
            let selectedValues = [];
            checkboxes.forEach((cb) => {
                if (cb.checked) {
                    selectedValues.push(cb.value);
                }
            });
            interviewerInput.value = selectedValues.join(', ');
            interviewerHidden.value = selectedValues.join(',');
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const header = document.querySelector("header");
            const sidebar = document.getElementById('sidebar');
            const menuItems = document.getElementById("menu-items");
            const menuBottom = document.getElementById("menuBottom");
            const userDropdown = document.getElementById("userDropdown");
            const dropdownMenu = document.getElementById("dropdownMenu");
            const toggleCollapse = document.getElementById("toggleCollapse");
            const collapseIcon = document.getElementById("collapseIcon");
            const mainContent = document.getElementById("mainContent");
            const menuTexts = document.querySelectorAll(".menu-text");
            const menuBottomLinks = document.querySelectorAll("#menuBottom a");

            let sidebarCollapsed = false;

            function handleResize() {
                if (window.innerWidth < 768) {
                    sidebarCollapsed = true;
                    menuItems.classList.add('*:justify-center');
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-24');
                    header.classList.remove('left-64');
                    header.classList.add('left-24');
                    collapseIcon.classList.remove('fa-angles-left');
                    collapseIcon.classList.add('fa-angles-right');
                    mainContent.classList.remove('md:ml-64');
                    mainContent.classList.add('ml-24');
                    menuBottom.classList.add('flex-col');

                    menuBottomLinks.forEach(link => {
                        link.classList.add('w-full');
                        link.classList.add('justify-center');
                    });

                    menuTexts.forEach(text => {
                        text.classList.add('hidden');
                    });
                } else {
                    sidebarCollapsed = false;
                    menuItems.classList.remove('*:justify-center');
                    sidebar.classList.add('w-64');
                    sidebar.classList.remove('w-24');
                    header.classList.add('left-64');
                    header.classList.remove('left-24');
                    collapseIcon.classList.add('fa-angles-left');
                    collapseIcon.classList.remove('fa-angles-right');
                    mainContent.classList.add('md:ml-64');
                    mainContent.classList.remove('ml-24');
                    menuBottom.classList.remove('flex-col');

                    menuBottomLinks.forEach(link => {
                        link.classList.remove('w-full');
                        link.classList.remove('justify-center');
                    });
                    menuTexts.forEach(text => {
                        text.classList.remove('hidden');
                    });
                }
            }

            function toggleSidebar() {

                if (!sidebarCollapsed && window.innerWidth >= 768 || !sidebarCollapsed && window.innerWidth < 768) {
                    menuItems.classList.add('*:justify-center');
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-24');
                    collapseIcon.classList.remove('fa-angles-left');
                    collapseIcon.classList.add('fa-angles-right');
                    mainContent.classList.remove('ml-64');
                    mainContent.classList.add('ml-24');
                    header.classList.remove('left-64');
                    header.classList.add('left-24');
                    menuBottomLinks.forEach(link => {
                        link.classList.add('w-full');
                        link.classList.add('justify-center');
                    });

                    menuTexts.forEach(text => {
                        text.classList.add('hidden');
                    });
                } else if (sidebarCollapsed && window.innerWidth < 768 || sidebarCollapsed && window.innerWidth >= 768) {
                    menuItems.classList.remove('*:justify-center');
                    sidebar.classList.add('w-64');
                    sidebar.classList.remove('w-24');
                    collapseIcon.classList.add('fa-angles-left');
                    collapseIcon.classList.remove('fa-angles-right');
                    mainContent.classList.add('ml-64');
                    mainContent.classList.remove('ml-24');
                    header.classList.add('left-64');
                    header.classList.remove('left-24');

                    menuBottomLinks.forEach(link => {
                        link.classList.remove('w-full');
                        link.classList.remove('justify-center');
                    });
                    menuTexts.forEach(text => {
                        text.classList.remove('hidden');
                    });
                }
                sidebarCollapsed = !sidebarCollapsed;
                menuBottom.classList.toggle('flex-col');
            }

            handleResize();

            window.addEventListener('resize', handleResize);

            toggleCollapse.addEventListener('click', toggleSidebar);

            userDropdown.addEventListener("mouseenter", function () {
                dropdownMenu.classList.remove("hidden");
            });

            userDropdown.addEventListener("mouseleave", function () {
                setTimeout(() => {
                    if (!dropdownMenu.matches(":hover")) {
                        dropdownMenu.classList.add("hidden");
                    }
                }, 200);
            });

            dropdownMenu.addEventListener("mouseleave", function () {
                dropdownMenu.classList.add("hidden");
            });
        });
    </script>
</body>

</html>
