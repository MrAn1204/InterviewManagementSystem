<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1976d2',    // màu xanh dương
                        secondary: '#424242', // xám đậm
                        // bạn có thể bổ sung thêm nếu cần
                    }
                },
            },
        };
    </script>
</head>

<body class="bg-gray-100">
    <!-- Header -->
    <header
        class="h-20 flex justify-between items-center shadow-md bg-white text-black p-4 fixed top-0 left-64 right-0 z-50">
        <div class="flex items-center max-md:relative max-md:w-full">
            <h1 class="text-2xl font-semibold">
                Homepage
            </h1>
        </div>
        <div class="flex items-center relative h-full">
            <div id="userDropdown" class="h-full flex items-center mr-4 cursor-pointer">
                <img src="./avatar.png" alt="User Avatar" class="h-10 w-10 rounded-full mr-2 bg-sky-500">
                <div class="hidden md:block">
                    <p class="text-xl">Nguyen Van A</p>
                    <p class="text-sm">HR Department</p>
                </div>
            </div>

            <!-- Dropdown Menu -->
            <div id="dropdownMenu"
                class="absolute top-full right-0 w-48 bg-white divide-y divide-gray-100 rounded-lg shadow-lg hidden">
                <ul class="py-2 text-sm text-gray-700">
                    <li>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Account</a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-100">Sign out</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="flex">
        <aside class="flex flex-col h-full w-64 bg-[#121C3E] text-white fixed left-0 z-50" id="sidebar">
            <div class="flex w-full mt-6 justify-center">
                <a href="#">
                    <img src="./logo-ims.png" alt="IMS Logo" class="h-10">
                </a>
            </div>
            <div class="flex flex-col mt-6" id="menu-items">
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-home text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Homepage</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-user text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Candidate</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-briefcase text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Job</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-calendar-alt text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Interview</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-file-alt text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Offer</span>
                </a>
                <a class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fas fa-users text-2xl w-8 mr-2"></i>
                    <span class="menu-text">User</span>
                </a>
            </div>
            <div class="mt-auto flex justify-between items-center text-center border-t border-slate-400"
                id="menuBottom">
                <a class="flex items-center grow w-full text-center p-4 hover:bg-[#FFC20E] hover:text-black" href="#">
                    <i class="fa-solid fa-gear text-2xl w-8 mr-2"></i>
                    <span class="menu-text">Settings</span>
                </a>
                <a id="toggleCollapse"
                    class="flex items-center text-center p-4 hover:bg-[#FFC20E] hover:text-black cursor-pointer"
                    href="#">
                    <i id="collapseIcon" class="fa-solid fa-angles-left text-2xl w-8 mr-2"></i>
                </a>
            </div>
        </aside>
        <!-- Main Content Area -->
        <div class="md:ml-64 ml-0 p-4 mt-16 grow transition-all duration-300" id="mainContent">
            <!-- Container chính, max-width ~1200px, margin auto -->
            <div class="container mx-auto max-w-screen-xl py-8 px-4">
                <!-- Tiêu đề -->
                <h1 class="text-4xl font-semibold mb-8">
                    Job Detail
                </h1>

                <!-- Breadcrumb -->
                <div class="pb-8 flex items-center justify-between">
                    <!-- Bên trái: Đường dẫn -->
                    <div>
                        <a class="text-xl text-primary hover:underline" href="">Job List</a>
                        >
                        <a class="text-xl text-primary hover:underline" href="">Job Detail</a>
                    </div>
                    <!-- Bên phải: thông tin Created/Updated -->
                    <div class="text-sm text-gray-500">
                        <p>Created at: 2025-03-20</p>
                        <p>Last updated: 2025-03-28</p>
                    </div>
                </div>

                <!-- Card bao quanh form -->
                <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
                    <!-- Phần I: Job information -->
                    <h2 class="text-2xl font-semibold mb-4">Job information</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Job Title (chỉ đọc) -->
                        <div>
                            <label for="jobTitle" class="block text-gl font-medium mb-1">
                                Job title
                            </label>
                            <input type="text" id="jobTitle" name="jobTitle"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
                                value="Senior Java Developer" />
                        </div>

                        <!-- Skills (chỉ xem) -->
                        <div>
                            <label class="block text-gl font-medium mb-1">
                                Skills
                            </label>
                            <div class="border border-gray-300 rounded-md p-3">
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Java" disabled checked class="mr-2" />
                                    Java
                                </label>
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Node.js" disabled checked class="mr-2" />
                                    Node.js
                                </label>
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="System design" disabled class="mr-2" />
                                    System design
                                </label>
                                <!-- ... -->
                            </div>
                        </div>

                        <!-- Start Date (chỉ đọc) -->
                        <div>
                            <label for="startDate" class="block text-gl font-medium mb-1">
                                Start Date
                            </label>
                            <input type="date" id="startDate" name="startDate"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
                                value="2025-03-25" />
                        </div>

                        <!-- End Date (chỉ đọc) -->
                        <div>
                            <label for="endDate" class="block text-fl font-medium mb-1">
                                End Date
                            </label>
                            <input type="date" id="endDate" name="endDate"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
                                value="2025-06-30" />
                        </div>

                        <!-- Salary range (chỉ xem) -->
                        <div>
                            <label class="block text-gl font-medium mb-1">
                                Salary Range
                            </label>
                            <div class="flex gap-2">
                                <label for="from" class="block text-sm content-center font-medium ">
                                    From
                                </label>
                                <input type="number" id="salaryFrom" name="salaryFrom"
                                    class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                                    readonly value="1000" />
                                <label for="to" class="block text-sm content-center font-medium ">
                                    to
                                </label>
                                <input type="number" id="salaryTo" name="salaryTo"
                                    class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                                    readonly value="2000" />
                            </div>
                        </div>

                        <!-- Working Address (chỉ đọc) -->
                        <div>
                            <label for="workingAddress" class="block text-gl font-medium mb-1">
                                Working address
                            </label>
                            <input type="text" id="workingAddress" name="workingAddress"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
                                value="Ho Chi Minh City" />
                        </div>

                        <!-- Benefits (chỉ xem) -->
                        <div>
                            <label class="block text-gl font-medium mb-1">
                                Benefits
                            </label>
                            <div class="border border-gray-300 rounded-md p-3">
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Health insurance" disabled checked class="mr-2" />
                                    Health insurance
                                </label>
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Paid vacation" disabled class="mr-2" />
                                    Paid vacation
                                </label>
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Free parking" disabled checked class="mr-2" />
                                    Free parking
                                </label>
                                <!-- ... -->
                            </div>
                        </div>

                        <!-- Level (chỉ xem) -->
                        <div>
                            <label class="block text-gl font-medium mb-1">
                                Level
                            </label>
                            <div class="border border-gray-300 rounded-md p-3">
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Fresher" disabled class="mr-2" />
                                    Fresher
                                </label>
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Junior" disabled class="mr-2" />
                                    Junior
                                </label>
                                <label class="flex items-center mb-1 cursor-default">
                                    <input type="checkbox" value="Senior" disabled checked class="mr-2" />
                                    Senior
                                </label>
                                <!-- ... -->
                            </div>
                        </div>

                        <!-- Description (chỉ đọc) -->
                        <div class="md:col-span-2">
                            <label for="description" class="block text-gl font-medium mb-1">
                                Description
                            </label>
                            <textarea id="description" name="description" rows="4"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
                                readonly>We are looking for a Senior Java Developer with Node.js experience.</textarea>
                        </div>
                    </div>

                    <!-- Nút Edit / Back -->
                    <div class="mt-8 flex justify-end">
                        <!-- Edit -->
                        <button type="button"
                            class="mr-4 bg-primary text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
                            Edit
                        </button>
                        <!-- Back -->
                        <button type="button"
                            class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
                            Back
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const header = document.querySelector("header");
            const sidebar = document.getElementById('sidebar');
            const menuItems = document.getElementById("menu-items");
            const menuBottom = document.getElementById("menuBottom");
            const userDropdown = document.getElementById("userDropdown");
            const dropdownMenu = document.getElementById("dropdownMenu");
            const toggleCollapse = document.getElementById("toggleCollapse");
            const collapseIcon = document.getElementById("collapseIcon");
            const mainContent = document.getElementById("mainContent");
            const menuTexts = document.querySelectorAll(".menu-text");
            const menuBottomLinks = document.querySelectorAll("#menuBottom a");

            let sidebarCollapsed = false;

            function handleResize() {
                if (window.innerWidth < 768) {
                    sidebarCollapsed = true;
                    menuItems.classList.add('*:justify-center');
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-24');
                    header.classList.remove('left-64');
                    header.classList.add('left-24');
                    collapseIcon.classList.remove('fa-angles-left');
                    collapseIcon.classList.add('fa-angles-right');
                    mainContent.classList.remove('md:ml-64');
                    mainContent.classList.add('ml-24');
                    menuBottom.classList.add('flex-col');

                    menuBottomLinks.forEach(link => {
                        link.classList.add('w-full');
                        link.classList.add('justify-center');
                    });

                    menuTexts.forEach(text => {
                        text.classList.add('hidden');
                    });
                } else {
                    sidebarCollapsed = false;
                    menuItems.classList.remove('*:justify-center');
                    sidebar.classList.add('w-64');
                    sidebar.classList.remove('w-24');
                    header.classList.add('left-64');
                    header.classList.remove('left-24');
                    collapseIcon.classList.add('fa-angles-left');
                    collapseIcon.classList.remove('fa-angles-right');
                    mainContent.classList.add('md:ml-64');
                    mainContent.classList.remove('ml-24');
                    menuBottom.classList.remove('flex-col');

                    menuBottomLinks.forEach(link => {
                        link.classList.remove('w-full');
                        link.classList.remove('justify-center');
                    });
                    menuTexts.forEach(text => {
                        text.classList.remove('hidden');
                    });
                }
            }

            function toggleSidebar() {

                if (!sidebarCollapsed && window.innerWidth >= 768 || !sidebarCollapsed && window.innerWidth < 768) {
                    menuItems.classList.add('*:justify-center');
                    sidebar.classList.remove('w-64');
                    sidebar.classList.add('w-24');
                    collapseIcon.classList.remove('fa-angles-left');
                    collapseIcon.classList.add('fa-angles-right');
                    mainContent.classList.remove('ml-64');
                    mainContent.classList.add('ml-24');
                    header.classList.remove('left-64');
                    header.classList.add('left-24');
                    menuBottomLinks.forEach(link => {
                        link.classList.add('w-full');
                        link.classList.add('justify-center');
                    });

                    menuTexts.forEach(text => {
                        text.classList.add('hidden');
                    });
                } else if (sidebarCollapsed && window.innerWidth < 768 || sidebarCollapsed && window.innerWidth >= 768) {
                    menuItems.classList.remove('*:justify-center');
                    sidebar.classList.add('w-64');
                    sidebar.classList.remove('w-24');
                    collapseIcon.classList.add('fa-angles-left');
                    collapseIcon.classList.remove('fa-angles-right');
                    mainContent.classList.add('ml-64');
                    mainContent.classList.remove('ml-24');
                    header.classList.add('left-64');
                    header.classList.remove('left-24');

                    menuBottomLinks.forEach(link => {
                        link.classList.remove('w-full');
                        link.classList.remove('justify-center');
                    });
                    menuTexts.forEach(text => {
                        text.classList.remove('hidden');
                    });
                }
                sidebarCollapsed = !sidebarCollapsed;
                menuBottom.classList.toggle('flex-col');
            }

            handleResize();

            window.addEventListener('resize', handleResize);

            toggleCollapse.addEventListener('click', toggleSidebar);

            userDropdown.addEventListener("mouseenter", function () {
                dropdownMenu.classList.remove("hidden");
            });

            userDropdown.addEventListener("mouseleave", function () {
                setTimeout(() => {
                    if (!dropdownMenu.matches(":hover")) {
                        dropdownMenu.classList.add("hidden");
                    }
                }, 200);
            });

            dropdownMenu.addEventListener("mouseleave", function () {
                dropdownMenu.classList.add("hidden");
            });
        });
    </script>
</body>

</html>
