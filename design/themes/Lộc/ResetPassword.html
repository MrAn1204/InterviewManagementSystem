<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - IMS Recruitment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white py-4 px-6 shadow">
        <div class="container mx-auto flex justify-between items-center">
            <div class="bg-black text-white font-bold p-2 rounded">DEV</div>
            <h1 class="text-xl font-bold absolute left-1/2 transform -translate-x-1/2">IMS Recruitment</h1>
        </div>
    </header>
    

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Đặt lại mật khẩu</h2>
                <p class="text-sm text-gray-600 mb-6 text-center">Vui lòng nhập mật khẩu mới của bạn</p>
                
                <form action="#" method="POST" id="reset-form">
                    <div class="mb-4">
                        <label for="password" class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="password" name="password" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 pr-10 sm:text-sm border-gray-300 rounded-md p-2 border" required>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                <button type="button" id="toggle-password" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Sử dụng ít nhất một chữ cái, một số và tối thiểu 7 ký tự</p>
                    </div>
                    
                    <div class="mb-6">
                        <label for="confirm-password" class="block text-sm font-medium text-gray-700">Xác nhận mật khẩu</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="confirm-password" name="confirm_password" class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 pr-10 sm:text-sm border-gray-300 rounded-md p-2 border" required>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                <button type="button" id="toggle-confirm-password" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Đặt lại
                        </button>
                    </div>
                </form>
                
                <!-- Message display area -->
                <div id="message-area" class="mt-4 hidden">
                    <div id="success-message" class="p-4 mb-4 text-sm text-green-700 bg-green-100 rounded-lg hidden">
                        <div class="flex items-center">
                            <i class="fas fa-check-circle mr-2"></i>
                            <span>Đặt lại mật khẩu thành công. <a href="login.html" class="font-medium underline">Đăng nhập ngay</a></span>
                        </div>
                    </div>
                    
                    <div id="error-message" class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg hidden">
                        <div class="flex items-center">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            <span id="error-text">Đã xảy ra lỗi.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
