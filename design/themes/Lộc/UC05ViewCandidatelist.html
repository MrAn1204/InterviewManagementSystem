<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Danh sách ứng viên</title>
</head>
<body>
    <div class="p-8">
        <div class="max-w-[1200px] mx-auto bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-[24px] font-semibold mb-4 p-2">Candidate List</h2>
            
            <div class="flex items-center gap-4 mb-4 p-2 md:flex-row flex-col">
                <div class="relative w-full md:w-1/3">
                    <input type="text" placeholder="Search" class="border border-[#ccc] p-2 rounded w-full pr-10 focus:border-[#1976d2]">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                </div>
                <select class="border border-[#ccc] p-2 rounded w-full md:w-1/3 focus:border-[#1976d2]">
                    <option>Status</option>
                    <option>Waiting for interview</option>
                    <option>Open</option>
                    <option>Interviewed</option>
                    <option>Offered</option>
                </select>
            </div>

            <div class="flex items-center justify-end mb-2">
                <button class="bg-[#1976d2] text-white px-4 py-2 mr-4 rounded font-semibold w-1/2 md:w-1/5">Search</button>
                <button class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-1/2 md:w-1/5">Add new</button>
            </div>
            
            <div class="card-body overflow-x-auto">
                <table class="w-full border-collapse border border-[#e0e0e0]">
                    <thead>
                        <tr class="bg-[#f5f5f5] font-semibold">
                            <th class="border border-[#e0e0e0] p-4">Name</th>
                            <th class="border border-[#e0e0e0] p-4">Email</th>
                            <th class="border border-[#e0e0e0] p-4">Phone No.</th>
                            <th class="border border-[#e0e0e0] p-4">Current Position</th>
                            <th class="border border-[#e0e0e0] p-4">Owner HR</th>
                            <th class="border border-[#e0e0e0] p-4">Status</th>
                            <th class="border border-[#e0e0e0] p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="even:bg-[#fafafa] hover:bg-gray-200">
                            <td class="border border-[#e0e0e0] p-4">Quách Trang</td>
                            <td class="border border-[#e0e0e0] p-4">trangq@gmail.com</td>
                            <td class="border border-[#e0e0e0] p-4">012345678</td>
                            <td class="border border-[#e0e0e0] p-4">BA</td>
                            <td class="border border-[#e0e0e0] p-4">anh1m5</td>
                            <td class="border border-[#e0e0e0] p-4 text-center">Offered</td>
                            <td class="border border-[#e0e0e0] p-4 text-center min-w-[90px]">
                                <button class="text-[#1976d2]">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                                <button class="text-[#388e3c]">
                                    <i class="fa-regular fa-pen-to-square"></i>
                                </button>
                                <button class="text-[#d32f2f]">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="flex justify-end items-center mt-6">
                <span class="text-[#757575] text-sm pr-2">10/60 rows</span>
                <div class="flex gap-2">
                    <button class="px-3 py-2 text-[#424242] rounded border border-[#e0e0e0]">&lt;</button>
                    <button class="px-3 py-2 text-[#424242] rounded border border-[#e0e0e0]">&gt;</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
