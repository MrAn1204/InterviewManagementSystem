<div class="card-body overflow-x-auto">
    <table class="w-full border-collapse border border-[#e0e0e0]">
        <thead>
            <tr class="bg-[#f5f5f5] font-semibold">
                <th *ngIf="isShowNumber" class="border border-[#e0e0e0] p-4">No</th>
                <th *ngFor="let item of columns" class="border border-[#e0e0e0] p-4">
                    {{item.name}}
                </th>
                <th class="border border-[#e0e0e0] p-4">Actions</th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngIf="data && data.items.length!=0;else emptyData">
                <tr *ngFor="let item of data.items; let i = index"
                    class="even:bg-[#fafafa] hover:bg-gray-200">
                    <td *ngIf="isShowNumber" class="text-center">{{currentPageSize * (currentPage -1) + i + 1}}</td>
                    <td *ngFor="let column of columns" class="border border-[#e0e0e0] p-4">
                        <div [ngSwitch]="column.value">
                            <div *ngSwitchCase="'schedule'">{{ `${item.interviewDate} ${item.startTime} - ${item.endTime}` }}</div>
                            <div *ngSwitchCase="'result'" class="text-center">{{item[column.value] ?? "N/A"}}</div>
                            <div *ngSwitchCase="'status'" class="text-center">{{item[column.value]}}</div>
                            <div *ngSwitchDefault>{{item[column.value]}}</div>
                        </div>
                    </td>
                    <td class="text-center space-x-2">
                        <button class="text-blue-500 hover:text-blue-700 cursor-pointer"
                            routerLink="/admin/interviews/1/detail">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                        <button class="text-green-500 hover:text-green-700 cursor-pointer"
                            routerLink="/admin/interviews/1/edit">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </button>
                    </td>
                </tr>
            </ng-container>
            <ng-template #emptyData>
                <tr>
                    <td colspan="4" class="text-center">No data found</td>
                </tr>
            </ng-template>
        </tbody>
    </table>
</div>
