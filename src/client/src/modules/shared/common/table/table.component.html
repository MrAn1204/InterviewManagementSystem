<div class="overflow-x-auto">
    <table class="w-full border-collapse">
        <thead>
            <tr class="*:p-4 *:border *:border-[#e0e0e0] bg-[#f5f5f5] text-gray-700 font-semibold text-left">
                <th *ngIf="isShowNumber">No</th>
                <th *ngFor="let item of columns">
                    {{item.name}}
                </th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngIf="data && data.items.length!=0;else emptyData">
                <tr *ngFor="let item of data.items; let i = index"
                    class="*:p-4 *:border *:border-[#e0e0e0] even:bg-[#fafafa] hover:bg-gray-100">
                    <td *ngIf="isShowNumber">{{currentPageSize * (currentPage -1) + i + 1}}</td>
                    <td *ngFor="let column of columns">
                        {{item[column.value]}}
                    </td>
                    <td class="text-center space-x-2">
                        <button class="text-blue-500 hover:text-blue-700 cursor-pointer"
                            routerLink="/admin/interviews/1/detail">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                        <button class="text-green-500 hover:text-green-700 cursor-pointer"
                            routerLink="/admin/interviews/1/edit">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </button>
                    </td>
                </tr>
            </ng-container>
            <ng-template #emptyData>
                <tr>
                    <td colspan="4" class="text-center">No data found</td>
                </tr>
            </ng-template>
        </tbody>
    </table>
</div>
