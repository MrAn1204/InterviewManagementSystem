<header class="h-20 flex justify-between items-center shadow-md bg-white text-black p-4 fixed top-0 right-0 z-50"
  [ngClass]="(sidebarService.isCollapsed$ || sidebarService.isMobile$ | async) ? 'left-18' : 'left-64'">
  <nav class="flex justify-between items-center w-full mx-auto">
    <!-- Nút Menu -->
    <div class="flex items-center">
      <button type="button" class="mr-3 flex items-center justify-center" title="Toggle menu" 
        (click)="sidebarService.toggleSidebar()">
        <fa-icon [icon]="faBars" class="text-xl"></fa-icon>
      </button>
      <!-- Homepage, gần với faBars trên mobile -->
      <h1 class="text-2xl font-semibold ml-2 md:ml-0 md:flex-1 text-center"
        [ngClass]="{'absolute left-1/2 -translate-x-1/2': (sidebarService.isMobile$ | async )}">
        {{headerService.title$ | async}}
      </h1>
    </div>

    <!-- Avatar -->
    <ng-container>
      <div class="profile-menu flex items-center relative h-full" (click)="toggleProfileDropdown($event)">
        <div class="h-full flex items-center cursor-pointer">
          <img src="./assets/avatar.png" alt="User Avatar" class="h-10 w-10 rounded-full mr-2 bg-sky-500 shrink-0">
          <div class="hidden md:block text-center">
            <p class="text-xl">{{userInfo?.displayName}}</p>
            <p class="text-sm text-gray-600">{{userInfo?.roles}}</p>
          </div>
        </div>
        <!-- Dropdown menu -->
        <div
          class="profile-dropdown absolute top-full right-0 bg-white *:text-black shadow-md w-[200px] rounded-md *:block *:p-4 *:hover:bg-blue-500 *:hover:text-white *:cursor-pointer"
          [ngClass]="{'hidden': !isShowProfileDropdown}">
          <a class="border-b border-slate-100 hover:rounded-t-md">Account</a>
          <button (click)="onLogout()" class="w-full text-left hover:rounded-b-md">
            Logout
          </button>
        </div>
      </div>
    </ng-container>
  </nav>
</header>
