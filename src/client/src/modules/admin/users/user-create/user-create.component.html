<div class="container mx-auto max-w-screen-xl py-8 px-4">

  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
          <label for="fullname" class="block text-lg font-semibold mb-1">
            User Name <span class="text-red-500">*</span>
          </label>
          <input type="text" id="fullname" formControlName="username"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type a username...">
          <div *ngIf="userForm.get('username')?.invalid && (userForm.get('username')?.dirty || userForm.get('username')?.touched)"
            class="text-red-500 mt-1">
            Username is required
          </div>
        </div>
        <!-- Full Name -->
        <div class="md:col-span-2">
          <label for="fullname" class="block text-lg font-semibold mb-1">
            Full Name <span class="text-red-500">*</span>
          </label>
          <input type="text" id="fullname" formControlName="fullName"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type a name...">
          <div *ngIf="userForm.get('fullName')?.invalid && (userForm.get('fullName')?.dirty || userForm.get('fullName')?.touched)"
            class="text-red-500 mt-1">
            Full name is required
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-lg font-semibold mb-1">
            Email <span class="text-red-500">*</span>
          </label>
          <input type="email" id="email" formControlName="email"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type an email...">
          <div *ngIf="userForm.get('email')?.invalid && (userForm.get('email')?.dirty || userForm.get('email')?.touched)"
            class="text-red-500 mt-1">
            <span *ngIf="userForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="userForm.get('email')?.errors?.['email']">Invalid email format</span>
          </div>
        </div>

        <!-- Date of Birth -->
        <div>
          <label for="dob" class="block text-lg font-semibold mb-1">Date of Birth</label>
          <input type="datetime-local" id="dob" formControlName="dob"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
        </div>

        <!-- Address -->
        <div>
          <label for="address" class="block text-lg font-semibold mb-1">Address</label>
          <input type="text" id="address" formControlName="address"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type an address...">
        </div>

        <!-- Phone Number -->
        <div>
          <label for="phoneNumber" class="block text-lg font-semibold mb-1">Phone Number</label>
          <input type="tel" id="phonenumber" formControlName="phoneNumber"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type a phone number...">
          <div *ngIf="userForm.get('phoneNumber')?.invalid && (userForm.get('phoneNumber')?.dirty || userForm.get('phoneNumber')?.touched)"
            class="text-red-500 mt-1">
            Invalid phone number (10-11 digits)
          </div>
        </div>

        <!-- Gender -->
        <div>
          <label for="gender" class="block text-lg font-semibold mb-1">
            Gender <span class="text-red-500">*</span>
          </label>
          <select id="gender" formControlName="gender"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="" disabled selected>Select a gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
          <div *ngIf="userForm.get('gender')?.invalid && (userForm.get('gender')?.dirty || userForm.get('gender')?.touched)"
            class="text-red-500 mt-1">
            Gender is required
          </div>
        </div>

        <!-- Phần Department -->
        <div>
          <label class="block text-lg font-semibold mb-1">
            Department <span class="text-red-500">*</span>
          </label>
          <select formControlName="departmentId"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="" disabled selected>Select a department</option>
            <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.departmentName }}</option>
          </select>
          <div *ngIf="userForm.get('departmentId')?.invalid && userForm.get('departmentId')?.touched"
            class="text-red-500 mt-1">
            Department is required
          </div>
        </div>

        <!-- Phần Roles -->
        <div class="md:col-span-2">
          <label class="block text-lg font-semibold mb-1">
            Roles <span class="text-red-500">*</span>
          </label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div *ngFor="let role of roles" class="flex items-center">
              <input type="checkbox" [id]="role" [value]="role"
                  (change)="onRoleChange(role, $any($event.target).checked)"
                class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
              <label [for]="role" class="ml-2 text-gray-700">{{ role }}</label>
            </div>
          </div>
          <div *ngIf="userForm.get('roles')?.invalid && userForm.touched"
            class="text-red-500 mt-1">
            At least one role must be selected
          </div>
        </div>

        <!-- Status -->
        <div>
          <label for="isActive" class="block text-lg font-semibold mb-1">
            Status <span class="text-red-500">*</span>
          </label>
          <select id="isActive" formControlName="isActive"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="" disabled selected>Select a status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="pending">Pending</option>
          </select>
          <div *ngIf="userForm.get('isActive')?.invalid && (userForm.get('isActive')?.dirty || userForm.get('isActive')?.touched)"
            class="text-red-500 mt-1">
            Status is required
          </div>
        </div>

        <!-- Note -->
        <div class="md:col-span-2">
          <label for="note" class="block text-lg font-semibold mb-1">Note</label>
          <textarea id="note" rows="4" formControlName="note"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type a note..."></textarea>
        </div>
      </div>

      <!-- Nút Submit/Cancel -->
      <div class="mt-8 flex justify-end">
        <button type="submit" [disabled]="userForm.invalid || userForm.pending"
          class="cursor-pointer mr-4 bg-[#1976d2] text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0] disabled:opacity-50 disabled:cursor-not-allowed">
          Submit
        </button>
        <button type="button" routerLink="/admin/users"
          class="cursor-pointer border border-[#1976d2] text-[#1976d2] bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
