<div class="p-6 bg-gray-100">
  <div class="mx-auto bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-6">User List</h2>

    <div class="flex flex-col md:flex-row items-center gap-4 mb-6">
      <div class="relative w-full md:w-1/3">
        <input type="text" placeholder="Search" class="border p-2 rounded w-full pr-10 focus:border-blue-500">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
      </div>
      <select class="border p-2 rounded w-full md:w-1/4 focus:border-blue-500">
        <option>Role</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
      </select>
    </div>

    <div class="flex items-center justify-end mb-2">
      <button class="bg-[#1976d2] text-white px-4 py-2 mr-4 rounded font-semibold w-1/2 md:w-1/5 cursor-pointer">Search</button>
      <button routerLink="/admin/users/create"
        class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-1/2 md:w-1/5 md:min-w-[100px] cursor-pointer">Add new</button>
    </div>

    <div class="card-body overflow-x-auto">
      <table class="w-full border-collapse">
        <thead>
          <tr class="*:p-3 *:border *:border-gray-200 bg-gray-100 font-semibold">
            <th class="border">Username</th>
            <th class="border">Email</th>
            <th class="border">Phone No.</th>
            <th class="border">Role</th>
            <th class="border">Status</th>
            <th class="border">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr class="*:p-3 *:border *:border-gray-200 even:bg-gray-50">
            <td class="border">locnt</td>
            <td class="border">locgmail.com</td>
            <td class="border">0911583726</td>
            <td class="border text-center">Developer</td>
            <td class="border text-center">Active</td>
            <td class="border text-center space-x-2">
              <button class="text-blue-500 hover:text-blue-700 cursor-pointer" routerLink="/admin/users/1/detail">
                <i class="fa-regular fa-eye"></i>
              </button>
              <button class="text-green-500 hover:text-green-700 cursor-pointer" routerLink="/admin/users/i/edit">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex justify-end items-center mt-6 gap-4">
      <span class="text-gray-700 text-sm">10/60 rows</span>
      <div class="flex gap-2">
        <button class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer">&lt;</button>
        <button class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer">&gt;</button>
      </div>
    </div>
  </div>
</div>
