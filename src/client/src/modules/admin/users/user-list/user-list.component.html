<div class="p-6 bg-gray-100">
  <div class="mx-auto bg-white p-8 rounded-lg shadow-md">
    <!-- Search and Filter Section -->
    <div class="flex flex-col md:flex-row items-center gap-4 mb-6">
      <div class="relative w-full md:w-1/3">
        <input type="text"
               [(ngModel)]="searchQuery"
               (keyup.enter)="onSearch()"
               placeholder="Search by name, email..."
               class="border p-2 rounded w-full pr-10 focus:border-blue-500">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
      </div>
      <select [(ngModel)]="selectedRole"
              (change)="onSearch()"
              class="border p-2 rounded w-full md:w-1/4 focus:border-blue-500">
        <option value="">All Roles</option>
        <option *ngFor="let role of roles" [value]="role">{{role}}</option>
      </select>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-end mb-2">
      <button (click)="onSearch()"
              class="bg-[#1976d2] text-white px-4 py-2 mr-4 rounded font-semibold w-1/2 md:w-1/5 cursor-pointer">
        Search
      </button>
      <button routerLink="/admin/users/create"
              class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-1/2 md:w-1/5 md:min-w-[100px] cursor-pointer">
        Add new
      </button>
    </div>

    <table class="w-full border-collapse">
      <thead>
        <tr class="bg-gray-100 *:p-3 *:border *:border-gray-200">
          <th>FullName</th>
          <th>Email</th>
          <th>Address</th>
          <th>Roles</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" class="*:p-3 *:border *:border-gray-200 even:bg-gray-50">
          <td>{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.address || 'N/A' }}</td>
          <td>
            <div class="flex flex-wrap gap-1">
              <span *ngFor="let role of user.roles"
                    class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm">
                {{ role }}
              </span>
            </div>
          </td>
          <td>
            <span [class.bg-green-100]="user.isActive"
                  [class.bg-red-100]="!user.isActive"
                  class="px-2 py-1 rounded text-sm">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="text-center space-x-2">
            <button class="text-blue-500 hover:text-blue-700 cursor-pointer"
                    [routerLink]="['/admin/users', user.id, 'detail']">
              <i class="fa-regular fa-eye"></i>
            </button>
            <button class="text-green-500 hover:text-green-700 cursor-pointer"
                    [routerLink]="['/admin/users', user.id, 'edit']">
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Phân trang -->
    <div class="mt-4 flex justify-between items-center">
      <span>View {{ (page - 1) * pageSize + 1 }} - {{ page * pageSize > totalCount ? totalCount : page * pageSize }} of {{ totalCount }} Items</span>
      <div class="flex gap-2">
        <button (click)="previousPage()" [disabled]="page === 1"
                class="px-3 py-1 border rounded disabled:opacity-50 cursor-pointer">
          &lt;
        </button>
        <button (click)="nextPage()" [disabled]="page * pageSize >= totalCount"
                class="px-3 py-1 border rounded disabled:opacity-50 cursor-pointer">
          &gt;
        </button>
      </div>
    </div>
  </div>
</div>
