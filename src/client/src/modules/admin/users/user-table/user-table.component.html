<div class="card-body overflow-x-auto">
  <table class="w-full border-collapse shadow-sm">
    <thead>
      <tr class="bg-gray-100 text-gray-800 font-semibold">
        <th *ngIf="isShowNumber" class="border px-4 py-2 text-center">No</th>
        <th *ngFor="let item of columns" class="border px-4 py-2">
          {{ item.name }}
        </th>
        <th class="border px-4 py-2 text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="data && data.items.length; else emptyData">
        <tr *ngFor="let item of data.items; let i = index"
            class="even:bg-gray-50 hover:bg-gray-200">
          <td *ngIf="isShowNumber" class="border px-4 py-2 text-center">
            {{ currentPageSize * (currentPage - 1) + i + 1 }}
          </td>
          <td *ngFor="let column of columns" class="border px-4 py-2">
            <div [ngSwitch]="column.value">
              <div *ngSwitchCase="'roles'" class="flex flex-wrap gap-1">
                <span *ngFor="let role of item[column.value] ?? []"
                      [ngClass]="getRoleClass(role)"
                      class="border rounded-3xl px-2 py-1 text-sm">
                  {{ role }}
                </span>
              </div>

              <div *ngSwitchCase="'isActive'">
                <span [ngClass]="{
                          'text-green-600': item[column.value] === true || item[column.value] === 'true',
                          'text-red-600': item[column.value] === false || item[column.value] === 'false'
                        }">
                  {{ (item[column.value] === true || item[column.value] === 'true') ? 'Active' : 'Inactive' }}
                </span>
              </div>
              <div *ngSwitchDefault>
                {{ item[column.value] || 'N/A' }}
              </div>
            </div>
          </td>

          <td class="border px-4 py-2 text-center">
            <button class="text-blue-500 hover:text-blue-700 mr-2 cursor-pointer" (click)="view(item.id)" title="View Detail">
              <i class="fa-regular fa-eye"></i>
            </button>
            <button class="text-green-500 hover:text-green-700 cursor-pointer" (click)="edit(item.id)" title="Edit">
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
          </td>
        </tr>
      </ng-container>
      <ng-template #emptyData>
        <tr>
          <td colspan="9" class="text-center py-4">No data found</td>
        </tr>
      </ng-template>
    </tbody>
  </table>
</div>

<div class="card-footer p-4 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
  <!-- Page Size -->
  <div class="page-size">
      <label for="page-size" class="mr-2">Items per page:</label>
      <select id="page-size" class="p-2 border border-gray-200 rounded-sm" [(ngModel)]="currentPageSize"
          (change)="onPageSizeChange.emit($event)">
          <option *ngFor="let item of pageSizeOptions" [value]="item">{{item}}</option>
      </select>
  </div>

  <!-- Page Items -->
  <nav
      class="page-items flex items-center space-x-2 text-slate-500 *:w-10 *:h-10 *:hover:bg-blue-500 *:hover:text-white *:rounded-full *:border *:border-blue-500 *:flex *:items-center *:justify-center *:cursor-pointer">
      <button (click)="onPageChange.emit(1)"
          class="disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-slate-500"
          title="First" type="button" [disabled]="currentPage==1">
          <fa-icon [icon]="faAngleDoubleLeft"></fa-icon>
      </button>
      <button (click)="onPageChange.emit(currentPage-1)"
          class="disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-slate-500"
          title="Previous" type="button" [disabled]="currentPage==1">
          <fa-icon [icon]="faAngleLeft"></fa-icon>
      </button>
      <ng-container *ngFor="let item of generatePageItems()">
          <button (click)="onPageChange.emit(item)"
              class="disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-slate-500"
              title="Page {{item}}" type="button" [ngClass]="{'bg-blue-500 text-white': item==currentPage}">
              {{item}}
          </button>
      </ng-container>
      <button (click)="onPageChange.emit(currentPage+1)"
          class="disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-slate-500"
          title="Next" type="button" [disabled]="data && currentPage===data.totalPages">
          <fa-icon [icon]="faAngleRight"></fa-icon>
      </button>
      <button (click)="onPageChange.emit(data.totalPages)"
          class="disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-slate-500"
          title="Last" type="button" [disabled]="data && currentPage===data.totalPages">
          <fa-icon [icon]="faAngleDoubleRight"></fa-icon>
      </button>
  </nav>

  <!-- Page Info -->
  <div class="page-info">
    {{ generatePageInfo() }}
  </div>
</div>
