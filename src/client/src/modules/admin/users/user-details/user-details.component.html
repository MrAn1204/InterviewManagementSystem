<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <h1 class="text-4xl font-semibold mb-8">User Detail</h1>

  <div class="pb-8 flex items-center justify-between">
    <div>
      <a routerLink="/admin/users" class="cursor-pointer text-xl text-[#1976d2] hover:underline">User List</a>
      > <span class="text-xl text-gray-500">User Detail</span>
    </div>
    <div class="text-sm text-gray-500" *ngIf="userDetail">
      <p>Created at: {{ userDetail.createdDate | date:'yyyy-MM-dd HH:mm' }}</p>
      <p *ngIf="userDetail.updatedDate">Last updated: {{ userDetail.updatedDate | date:'yyyy-MM-dd HH:mm' }}</p>
    </div>
  </div>

  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <h2 class="text-2xl font-semibold mb-4">User information</h2>

    <div *ngIf="isLoading" class="text-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
    </div>

    <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Full Name -->
      <div>
        <label class="block text-lg font-semibold mb-1">Full Name</label>
        <input type="text" [value]="userDetail.fullName"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-lg font-semibold mb-1">Email</label>
        <input type="email" [value]="userDetail.email"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Date of Birth -->
      <div>
        <label class="block text-lg font-semibold mb-1">Date of Birth</label>
        <input type="date" [value]="userDetail.dob | date:'yyyy-MM-dd'"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Address -->
      <div>
        <label class="block text-lg font-semibold mb-1">Address</label>
        <input type="text" [value]="userDetail.address"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-lg font-semibold mb-1">Phone Number</label>
        <input type="tel" [value]="userDetail.phoneNumber"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Gender -->
      <div>
        <label class="block text-lg font-semibold mb-1">Gender</label>
        <input type="text" [value]="userDetail.gender"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Roles -->
      <div>
        <label class="block text-lg font-semibold mb-1">Roles</label>
        <input type="text" [value]="userDetail.roles.join(', ')"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Department -->
      <div>
        <label class="block text-lg font-semibold mb-1">Department</label>
        <input type="text" [value]="userDetail.departmentName"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Status -->
      <div>
        <label class="block text-lg font-semibold mb-1">Status</label>
        <input type="text" [value]="getStatusText(userDetail.isActive)"
               class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50" readonly>
      </div>

      <!-- Note -->
      <div class="md:col-span-2">
        <label class="block text-lg font-semibold mb-1">Note</label>
        <textarea class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50"
                  rows="3" readonly>{{ userDetail.note }}</textarea>
      </div>
    </div>

    <div class="mt-8 flex justify-end">
      <button type="button" (click)="onEdit()"
        class="cursor-pointer mr-4 bg-[#1976d2] text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
        Edit
      </button>
      <button type="button"
              class="mr-4 bg-yellow-400 text-white font-semibold py-2 px-6 rounded-md hover:bg-yellow-300">
              Inactive
            </button>

      <button type="button" routerLink="/admin/users"
        class="cursor-pointer border border-[#1976d2] text-[#1976d2] bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
        Back
      </button>
    </div>
  </div>
</div>
