<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <!-- Tiêu đề (giữ font-semibold) -->
  <h1 class="text-4xl font-semibold mb-8">Create Candidate</h1>
  <div class="pb-8">
    <a class="text-xl cursor-pointer" routerLink="/admin/candidates"
      ><u>Candidate List</u></a
    >
    >
    <a class="text-xl" href=""><u>Create Candidate</u></a>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <form [formGroup]="form" (ngSubmit)="onSubmit">
      <!-- Phần I: Personal information -->
      <h2 class="text-2xl font-semibold mb-4">I. Personal information</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Full Name (required) -->
        <div>
          <label for="fullName" class="block text-lg mb-1 font-semibold">
            Full name
            <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="fullName"
            formControlName="fullName"
            placeholder="Type a name..."
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            required
          />
        </div>

        <!-- Email (required) -->
        <div>
          <label for="email" class="block text-lg mb-1 font-semibold">
            Email
            <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Type an email..."
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            required
          />
        </div>

        <!-- D.O.A (Date of Appointment) -> datetime-local -->
        <div>
          <label for="doa" class="block text-lg mb-1 font-semibold">
            D.O.B
          </label>
          <input
            type="date"
            id="doa"
            name="dob"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          />
        </div>

        <!-- Address -->
        <div>
          <label for="address" class="block text-lg mb-1 font-semibold">
            Address
          </label>
          <input
            type="text"
            id="address"
            formControlName="address"
            placeholder="Type an address..."
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          />
        </div>

        <!-- Phone Number -->
        <div>
          <label for="phoneNumber" class="block text-lg mb-1 font-semibold">
            Phone number
          </label>
          <input
            type="text"
            id="phoneNumber"
            formControlName="phoneNumber"
            placeholder="Type a number..."
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          />
        </div>

        <!-- Gender (required) -->
        <div>
          <label for="gender" class="block text-lg mb-1 font-semibold">
            Gender
            <span class="text-red-500">*</span>
          </label>
          <select
            id="gender"
            formControlName="gender"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            required
          >
            <option [value]="0">Male</option>
            <option [value]="1">Female</option>
            <option [value]="null">Other</option>
          </select>
        </div>
      </div>

      <!-- Phần II: Professional information -->
      <h2 class="text-2xl font-semibold mt-8 mb-4">
        II. Professional information
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- CV Attachment -->
        <div>
          <label for="cvAttachment" class="block text-lg mb-1 font-semibold">
            CV attachment
          </label>
          <input
            type="file"
            id="cvAttachment"
            formControlName="cvAttachment"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          />
        </div>

        <!-- Note -->
        <div>
          <label for="note" class="block text-lg mb-1 font-semibold">
            Note
          </label>
          <input
            type="text"
            id="note"
            formControlName="note"
            placeholder="N/A"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          />
        </div>

        <!-- Position -->
        <div>
          <label for="position" class="block text-lg mb-1 font-semibold">
            Position
          </label>
          <select
            id="position"
            formControlName="position"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          >
            <option value="">Select a position</option>
            <option value="backend">Backend Developer</option>
            <option value="frontend">Frontend Developer</option>
            <option value="fullstack">Fullstack Developer</option>
            <option value="qa">QA Engineer</option>
            <!-- ... -->
          </select>
        </div>

        <!-- Skills (multi-select) & required -->
        <div class="relative" id="skills-wrapper font-semibold">
          <label class="block text-lg mb-1">
            Skills
            <span class="text-red-500">*</span>
          </label>
          <!-- Ô input hiển thị các kỹ năng đã chọn (chỉ đọc) -->
          <input
            type="text"
            id="skillsInput"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] cursor-pointer"
            placeholder="Click to select skills"
            readonly
            (click)="isDropDownOpen = !isDropDownOpen"
            required
          />
          <!-- Dropdown chứa danh sách checkbox -->
          <div
            id="skillsDropdown"
            class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg"
            *ngIf="isDropDownOpen"
          >
            <div class="p-2 max-h-48 overflow-y-auto">
              <!-- Mỗi kỹ năng là 1 checkbox + label -->
              <label
                *ngFor="let skill of skillList"
                class="flex items-center mb-1 cursor-pointer"
              >
                <input
                  type="checkbox"
                  [value]="skill.id"
                  class="mr-2"
                  onclick="updateSkillsSelected()"
                />
                {{ skill.skillName }}
              </label>
            </div>
          </div>
          <!-- Gợi ý cách chọn -->
          <small class="text-gray-500">
            Click vào ô để mở danh sách. Tích chọn nhiều kỹ năng tuỳ ý.
          </small>
          <!-- Hidden input để submit giá trị (nếu cần) -->
          <input type="hidden" name="skills" id="skillsHidden" required />
        </div>

        <!-- Status (required) -->
        <div>
          <label for="status" class="block text-lg mb-1 font-semibold">
            Status
            <span class="text-red-500">*</span>
          </label>
          <select
            id="status"
            formControlName="status"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            required
          >
            <option value="">Select a status</option>
            <option value="1">Active</option>
            <option value="2">On hold</option>
            <option value="3">Archived</option>
          </select>
        </div>

        <!-- Recruiter (required) -->
        <div>
          <label for="recruiter" class="block text-lg mb-1 font-semibold">
            Recruiter
            <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="recruiter"
            name="recruiter"
            placeholder="Recruiter name"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            required
          />
          <a class="text-xs" href="">
            <u>Assign me</u>
          </a>
        </div>

        <!-- Years of Experience -->
        <div>
          <label for="experience" class="block text-lg mb-1 font-semibold">
            Years of Experience
          </label>
          <input
            type="number"
            id="experience"
            formControlName="experience"
            placeholder="Type a number..."
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
          />
        </div>

        <!-- Highest level (required) -->
        <div>
          <label for="highestLevel" class="block text-lg mb-1 font-semibold">
            Highest level
            <span class="text-red-500">*</span>
          </label>
          <select
            id="highestLevel"
            formControlName="highestLevel"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            required
          >
            <option *ngFor="let level of levelList" [value]="level.id">
              {{ level.levelName }}
            </option>
          </select>
        </div>
      </div>

      <!-- Nút Submit/Cancel -->
      <div class="mt-8 flex justify-end">
        <!-- Submit -->
        <button
          type="submit"
          class="mr-4 bg-[#1976d2] text-white py-2 px-6 rounded-md hover:bg-[#125cb0] cursor-pointer"
        >
          Submit
        </button>
        <!-- Cancel -->
        <button
          routerLink="/admin/candidates"
          type="button"
          class="border border-[#1976d2] text-[#1976d2] bg-white py-2 px-6 rounded-md hover:bg-[#e3f2fd] cursor-pointer"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
