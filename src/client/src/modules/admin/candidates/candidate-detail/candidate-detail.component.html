<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <!-- Tiêu đề -->
  <h1 class="text-4xl font-semibold mb-8">
    Candidate Details
  </h1>

  <!-- Breadcrumb + Nút Ban Candidate -->
  <div class="pb-8 flex items-center justify-between">
    <!-- Breadcrumb -->
    <div>
      <a routerLink="/admin/candidates" class="text-xl text-primary hover:underline" href="">Candidate List</a>
      >
      <a class="text-xl text-primary hover:underline" href="">Candidate Details</a>
    </div>
    <!-- Nút Ban Candidate -->
    <button type="button" class="border border-red-500 text-red-500 font-semibold py-2 px-4 rounded-md hover:bg-red-50">
      Ban Candidate
    </button>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <!-- Phần I: Personal information + Created/Updated -->
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-semibold mb-4">
        I. Personal information
      </h2>
      <!-- Thông tin Created / Last updated -->
      <div class="text-sm text-gray-500 mb-4">
        <p>Created at: 2025-03-20</p>
        <p>Last updated at: 2025-03-24</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Full Name -->
      <div>
        <label for="fullName" class="block text-lg font-semibold mb-1">
          Full name
        </label>
        <input type="text" id="fullName" name="fullName"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly value="John Doe" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-lg font-semibold mb-1">
          Email
        </label>
        <input type="email" id="email" name="email"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
          value="john.doe@example.com" />
      </div>

      <!-- D.O.B -->
      <div>
        <label for="doa" class="block text-lg font-semibold mb-1">
          D.O.B
        </label>
        <input type="datetime-local" id="doa" name="dob"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
          value="2025-03-24T09:30" />
      </div>

      <!-- Address -->
      <div>
        <label for="address" class="block text-lg font-semibold mb-1">
          Address
        </label>
        <input type="text" id="address" name="address"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
          value="123 Main Street, District 1" />
      </div>

      <!-- Phone Number -->
      <div>
        <label for="phoneNumber" class="block text-lg font-semibold mb-1">
          Phone number
        </label>
        <input type="text" id="phoneNumber" name="phoneNumber"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly value="0123456789" />
      </div>

      <!-- Gender -->
      <div>
        <label for="gender" class="block text-lg font-semibold mb-1">
          Gender
        </label>
        <select id="gender" name="gender" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
          disabled>
          <option value="male" selected>Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <!-- Phần II: Professional information -->
    <h2 class="text-2xl font-semibold mt-8 mb-4">
      II. Professional information
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- CV Attachment -->
      <div>
        <label for="cvAttachment" class="block text-lg font-semibold mb-1">
          CV attachment
        </label>
        <input type="file" id="cvAttachment" name="cvAttachment"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" disabled />
        <small class="text-gray-500">
          (Currently:
          <a href="#" class="text-primary hover:underline">CV_JohnDoe.pdf</a>)
        </small>
      </div>

      <!-- Note -->
      <div>
        <label for="note" class="block text-lg font-semibold mb-1">
          Note
        </label>
        <input type="text" id="note" name="note"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
          value="Candidate referred by internal team." />
      </div>

      <!-- Position -->
      <div>
        <label for="position" class="block text-lg font-semibold mb-1">
          Position
        </label>
        <select id="position" name="position"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" disabled>
          <option value="">Select a position</option>
          <option value="backend" selected>Backend Developer</option>
          <option value="frontend">Frontend Developer</option>
          <option value="fullstack">Fullstack Developer</option>
          <option value="qa">QA Engineer</option>
        </select>
      </div>

      <!-- Status -->
      <div>
        <label for="status" class="block text-lg font-semibold mb-1">
          Status
        </label>
        <select id="status" name="status" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
          disabled>
          <option value="1" selected>Active</option>
          <option value="2">On hold</option>
          <option value="3">Archived</option>
        </select>
      </div>

      <!-- Skills (chỉ hiển thị) -->
      <div>
        <label class="block text-lg font-semibold mb-1">
          Skills
        </label>
        <div class="border border-gray-300 rounded-md p-3">
          <label class="flex items-center mb-1 cursor-default">
            <input type="checkbox" value="Java" class="mr-2" disabled checked />
            Java
          </label>
          <label class="flex items-center mb-1 cursor-default">
            <input type="checkbox" value="Node.js" class="mr-2" disabled checked />
            Node.js
          </label>
          <!-- ... -->
        </div>
      </div>

      <!-- Recruiter -->
      <div>
        <label for="recruiter" class="block text-lg font-semibold mb-1">
          Recruiter
        </label>
        <input type="text" id="recruiter" name="recruiter"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly value="Jane Smith" />
      </div>

      <!-- Years of Experience -->
      <div>
        <label for="experience" class="block text-lg font-semibold mb-1">
          Years of Experience
        </label>
        <input type="number" id="experience" name="experience"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly value="3" />
      </div>

      <!-- Highest level -->
      <div>
        <label for="highestLevel" class="block text-lg font-semibold mb-1">
          Highest level
        </label>
        <select id="highestLevel" name="highestLevel"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" disabled>
          <option value="bachelor">Bachelor</option>
          <option value="master" selected>Master</option>
          <option value="phd">PhD</option>
        </select>
      </div>
    </div>

    <!-- Nút Edit/Cancel -->
    <div class="mt-8 flex justify-end">
      <!-- Edit -->
      <button type="button" class="mr-4 bg-primary text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
        Edit
      </button>
      <!-- Cancel -->
      <button routerLink="/admin/candidates" type="button"
        class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
        Cancel
      </button>
    </div>
  </div>
</div>
