<div class="p-8 bg-gray-100">
  <div class="max-w-5xl mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">Interview Schedule List</h2>

    <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
      <div class="relative w-full md:w-1/3">
        <input type="text" placeholder="Search"
          class="border border-gray-300 p-3 rounded w-full pr-10 focus:outline-none focus:border-[#1976d2]">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
      </div>
      <select class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
        <option>Interviewer</option>
        <option>Waiting for interview</option>
        <option>Open</option>
        <option>Interviewed</option>
        <option>Offered</option>
      </select>
      <select class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
        <option>Status</option>
        <option>Waiting for interview</option>
        <option>Open</option>
        <option>Interviewed</option>
        <option>Offered</option>
      </select>
    </div>

    <div class="flex items-center justify-end mb-2">
      <button class="bg-[#1976d2] text-white px-4 py-2 mr-4 rounded font-semibold w-1/2 md:w-1/5">Search</button>
      <button routerLink="/admin/interviews/create"
        class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-1/2 md:w-1/5">Add new</button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse">
        <thead>
          <tr class="*:p-4 *:border *:border-[#e0e0e0] bg-[#f5f5f5] text-gray-700 font-semibold text-left">
            <th>Title</th>
            <th>Candidate Name</th>
            <th>Interviewer</th>
            <th>Scheduled Date</th>
            <th>Result</th>
            <th>Status</th>
            <th>Job</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr class="*:p-4 *:border *:border-[#e0e0e0] even:bg-[#fafafa] hover:bg-gray-100">
            <td>Senior Backend Developer Interview</td>
            <td>John Doe</td>
            <td>Jane Smith</td>
            <td>22/02/2022</td>
            <td class="text-center">N/A</td>
            <td class="text-center text-[#1976d2] font-semibold">New</td>
            <td class="text-center">Dev Team</td>
            <td class="text-center">
              <button class="text-blue-500 hover:text-blue-700 mx-1" routerLink="/admin/interviews/1/detail">
                <i class="fa-regular fa-eye"></i>
              </button>
              <button class="text-green-500 hover:text-green-700 mx-1" routerLink="/admin/interviews/1/edit">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex justify-end items-center mt-6">
      <span class="text-[#757575] text-sm pr-2">10/60 rows</span>
      <div class="flex gap-2">
        <button class="px-3 py-2 text-[#424242] rounded border border-[#e0e0e0]">&lt;</button>
        <button class="px-3 py-2 text-[#424242] rounded border border-[#e0e0e0]">&gt;</button>
      </div>
    </div>
  </div>
</div>
