<div class="p-8 bg-gray-100">
  <div class=" mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">Interview Schedule List</h2>

    <form [formGroup]="searchForm">
      <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
        <div class="relative w-full md:w-1/3">
          <input type="text" placeholder="Search" formControlName="keyword"
            class="border border-gray-300 p-3 rounded w-full pr-10 focus:outline-none focus:border-[#1976d2]">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
        </div>
        <select formControlName="interviewerId"
          class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
          <option value="0" [selected]="searchForm.get('interviewerId')?.value === 0">Any Interviewer</option>
          <option *ngFor="let interviewer of interviewerList" [value]="interviewer.id">
            {{ `${interviewer.fullName} - ${interviewer.userName}` }}
          </option>
        </select>
        <select id="status" formControlName="status"
          class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
          <option value="" [selected]="searchForm.get('status')?.value === 0">Any Status</option>
          <option *ngFor="let status of statusList" [value]="status">
            {{ status }}
          </option>
        </select>
      </div>

      <div class="flex flex-col md:flex-row justify-end gap-4 mb-4">
        <button (click)="searchData()"
          class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Search</button>
        <button routerLink="/admin/interviews/create"
          class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Add new</button>
      </div>
    </form>

    <!-- Table -->
    <app-table
      [columns]="columns"
      [data]="data"
      [currentPage]="currentPage"
      [currentPageSize]="currentPageSize"
      [pageSizeOptions]="pageSizeOptions"
      (onPageChange)="onPageChange($event)"
      (onPageSizeChange)="onPageSizeChange($event)">
    </app-table>
  </div>
</div>
