<div class="p-8 bg-gray-100">
  <div class=" mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">Interview Schedule List</h2>

    <form [formGroup]="searchForm">
      <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
        <div class="relative w-full md:w-1/3">
          <input type="text" placeholder="Search" formControlName="keyword"
            class="border border-gray-300 p-3 rounded w-full pr-10 focus:outline-none focus:border-[#1976d2]">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
        </div>
        <select class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
          <option>Interviewer</option>
          <option>Waiting for interview</option>
          <option>Open</option>
          <option>Interviewed</option>
          <option>Offered</option>
        </select>
        <select class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
          <option>Status</option>
          <option>Waiting for interview</option>
          <option>Open</option>
          <option>Interviewed</option>
          <option>Offered</option>
        </select>
      </div>
  
      <div class="flex items-center justify-end mb-2">
        <button (click)="search()"
          class="bg-[#1976d2] text-white px-4 py-2 mr-4 rounded font-semibold w-1/2 md:w-1/5 cursor-pointer">Search</button>
        <button routerLink="/admin/interviews/create"
          class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-1/2 md:w-1/5 md:min-w-[100px] cursor-pointer">Add
          new</button>
      </div>
    </form>

    <!-- Table -->
    <app-table [columns]="columns" [data]="data">

    </app-table>

    <div class="flex justify-end items-center mt-6 gap-4">
      <span class="text-gray-700 text-sm"
        >{{ data ? data.pageNumber : 0 }}/{{
          data ? data.totalPages : 0
        }}
        pages</span
      >
      <div class="flex gap-2">
        <button
          class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer"
          (click)="pageChange(-1)"
        >
          &lt;
        </button>
        <button
          class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer"
          (click)="pageChange(1)"
        >
          &gt;
        </button>
      </div>
    </div>
  </div>
</div>
