<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <!-- Tiêu đề -->
  <h1 class="text-4xl font-semibold mb-8">
    New Interview Schedule
  </h1>

  <!-- Breadcrumb -->
  <div class="pb-8">
    <a routerLink="/admin/interviews" class="text-xl text-[#1976d2] hover:underline" href="">Interview Schedule List</a>
    >
    <a class="text-xl text-[#1976d2] hover:underline" href="">New Interview Schedule</a>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Phần I: Schedule information -->
      <h2 class="text-2xl font-semibold mb-4">Schedule Information</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Schedule Title -->
        <div>
          <label for="title" class="block text-lg font-semibold mb-1">
            Schedule title
            <span class="text-red-500">*</span>
          </label>
          <input type="text" id="title" formControlName="title" placeholder="Type a title..."
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
        </div>

        <!-- Schedule Time -->
        <div class="space-y-2">
          <label for="interviewDate" class="block text-lg font-semibold mb-1">
            Schedule Time <span class="text-red-500">*</span>
          </label>
          <input type="date" id="interviewDate" formControlName="interviewDate"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />

          <!-- Time Pickers Container -->
          <div class="flex flex-wrap sm:flex-nowrap gap-4">
            <!-- Start Time -->
            <div class="w-full sm:w-1/2">
              <label for="startTime" class="block mb-1">From <span class="text-red-500">*</span></label>
              <input type="time" id="startTime" formControlName="startTime"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] min-w-0" />
            </div>

            <!-- End Time -->
            <div class="w-full sm:w-1/2">
              <label for="endTime" class="block mb-1">To <span class="text-red-500">*</span></label>
              <input type="time" id="endTime" formControlName="endTime"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] min-w-0" />
            </div>
          </div>
        </div>

        <!-- Candidate name -->
        <div>
          <label for="candidateId" class="block text-lg font-semibold mb-1">
            Candidate name
            <span class="text-red-500">*</span>
          </label>
          <select id="candidateId" formControlName="candidateId"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="">Select candidate...</option>
            <option value="1">John Doe</option>
            <option value="1">Jane Smith</option>
            <option value="1">Michael Lee</option>
            <!-- ... -->
          </select>
        </div>

        <!-- Job -->
        <div>
          <label for="jobId" class="block text-lg font-semibold mb-1">
            Job
            <span class="text-red-500">*</span>
          </label>
          <select id="jobId" formControlName="jobId"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="">Select a job...</option>
            <option value="9">Backend Developer</option>
            <option value="9">Frontend Developer</option>
            <option value="9">QA Engineer</option>
            <!-- ... -->
          </select>
        </div>

        <!-- Interviewer (multi-select dropdown) -->
        <div class="relative" id="interviewer-wrapper">
          <label class="block text-lg font-semibold mb-1">
            Interviewer
            <span class="text-red-500">*</span>
          </label>
          <input type="text" id="interviewersId" formControlName="interviewersId"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] cursor-pointer"
            placeholder="Click to select interviewer(s)" readonly (click)="toggleDropdown()" />
          <!-- Dropdown -->
          <div id="interviewerDropdown" *ngIf="dropdownVisible"
            class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg">
            <div class="p-2 max-h-48 overflow-y-auto">
              <label *ngFor="let interviewer of interviewerList" class="flex items-center mb-1 cursor-pointer">
                <input type="checkbox" [value]="1" (change)="updateInterviewerSelected(interviewer)" [checked]="selectedInterviewers.includes(interviewer)"/>
                {{ interviewer }}
              </label>
            </div>
          </div>
          <small class="text-gray-500">
            Click vào ô để mở danh sách. Tích chọn nhiều interviewer nếu cần.
          </small>
          <input type="hidden" formControlName="interviewersId" id="interviewersId" />
        </div>

        <!-- Recruiter owner -->
        <div>
          <label for="recruiterId" class="block text-lg font-semibold mb-1">
            Recruiter owner
            <span class="text-red-500">*</span>
          </label>
          <select id="recruiterId" formControlName="recruiterId"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="">Select a job...</option>
            <option value="1">Backend Developer</option>
            <option value="1">Frontend Developer</option>
            <option value="1">QA Engineer</option>
            <!-- ... -->
          </select>
          <a class="text-xs text-[#1976d2] hover:underline" href="">
            <u>Assign me</u>
          </a>
        </div>

        <!-- Location -->
        <div>
          <label for="location" class="block text-lg font-semibold mb-1">
            Location
          </label>
          <input type="text" id="location" formControlName="location" placeholder="Type a location"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
        </div>

        <!-- Meeting ID -->
        <div>
          <label for="meetingId" class="block text-lg font-semibold mb-1">
            Meeting ID
          </label>
          <input type="text" id="meetingId" formControlName="meetingId" placeholder="meet.google.com/xyz-abc"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
        </div>

        <!-- Notes -->
        <div class="md:col-span-2">
          <label for="note" class="block text-lg font-semibold mb-1">
            Notes
          </label>
          <textarea id="note" formControlName="note" rows="8" placeholder="Type schedule note..." class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 
              focus:ring-[#1976d2] min-h-[150px] max-h-[300px]"></textarea>
        </div>
      </div>

      <!-- Nút Submit/Cancel -->
      <div class="mt-8 flex justify-end">
        <!-- Submit -->
        <button type="submit"
          class=" cursor-pointer mr-4 bg-[#1976d2] text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
          Submit
        </button>
        <!-- Cancel -->
        <button type="button" routerLink="/admin/interviews" (click)="onSubmit()"
          class=" cursor-pointer border border-[#1976d2] text-[#1976d2] bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
