<div class="container mx-auto py-8 px-4">
  <!-- Tiêu đề -->
  <h1 class="text-4xl font-semibold mb-8">
    Job Edit
  </h1>

  <!-- Breadcrumb -->
  <div class="pb-8 flex items-center justify-between">
    <!-- Bên trái: Đường dẫn -->
    <div>
      <a routerLink="/admin/jobs" class="cursor-pointer text-xl text-[#1976d2] hover:underline" href="">Job List</a>
      >
      <a class="cursor-pointer text-xl text-[#1976d2] hover:underline" href="">Job Detail</a>
    </div>
    <!-- Bên phải: thông tin Created/Updated -->
    <div class="text-sm text-gray-500">
      <p>Created at: 2025-03-20</p>
      <p>Last updated: 2025-03-28</p>
    </div>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <!-- Phần I: Job information -->
    <h2 class="text-2xl font-semibold mb-4">Job information</h2>

    <ng-container *ngIf="data; else failed">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Job Title (chỉ đọc) -->
        <div>
          <label for="jobTitle" class="block text-lg font-medium mb-1">
            Job title
          </label>
          <input type="text" id="jobTitle" name="jobTitle"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
            value={{data.title}} />
        </div>

        <!-- Skills (chỉ xem) -->
        <div class="relative" id="skills-wrapper">
          <label class="block text-lg font-semibold mb-1">
            Skills
          </label>
          <input type="text" [value]="getSelectedItemsText('skills')"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] cursor-pointer"
            placeholder="Click to select skills" readonly (click)="toggleDropdown('skills', $event)" />
          <!-- Dropdown chứa danh sách checkbox -->
          <div class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg"
            [ngClass]="{'hidden': !skillsDropdownOpen}">
            <div class="p-2 max-h-48 overflow-y-auto">
              <label *ngFor="let skill of skills; let i = index" class="flex items-center mb-1 cursor-pointer">
                <input type="checkbox" [checked]="skill.selected" (change)="updateSelection('skills', i)"
                  class="mr-2" />
                {{ skill.skillName }}
              </label>
            </div>
          </div>
          <input type="hidden" formControlName="skills" />
        </div>

        <!-- Start Date (chỉ đọc) -->
        <div>
          <label for="startDate" class="block text-lg font-medium mb-1">
            Start Date
          </label>
          <input type="date" id="startDate" name="startDate"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
            [value]="data.startDate" />
        </div>

        <!-- End Date (chỉ đọc) -->
        <div>
          <label for="endDate" class="block text-fl font-medium mb-1">
            End Date
          </label>
          <input type="date" id="endDate" name="endDate"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
            [value]="data.endDate ? (data.endDate | date: 'dd/MM/yyyy') : null" />
        </div>

        <!-- Salary range (chỉ xem) -->
        <div>
          <label class="block text-lg font-medium mb-1">
            Salary Range
          </label>
          <div class="flex gap-2">
            <label for="from" class="block text-sm content-center font-medium ">
              From
            </label>
            <input type="number" id="salaryFrom" name="salaryFrom" title="Salary From"
              class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
              [value]="data.salaryMin" />
            <label for="to" class="block text-sm content-center font-medium ">
              to
            </label>
            <input type="number" id="salaryTo" name="salaryTo" title="Salary To"
              class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
              [value]="data.salaryMax" />
          </div>
        </div>

        <!-- Working Address (chỉ đọc) -->
        <div>
          <label for="workingAddress" class="block text-lg font-medium mb-1">
            Working address
          </label>
          <input type="text" id="workingAddress" name="workingAddress"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" readonly
            [value]="data.workingAddress" />
        </div>

        <!-- Benefits (chỉ xem) -->
        <div class="relative" id="benefits-wrapper">
          <label class="block text-lg font-semibold mb-1">
            Benefits
            <span class="text-red-500">*</span>
          </label>
          <input type="text" [value]="getSelectedItemsText('benefits')"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] cursor-pointer"
            placeholder="Click to select benefits" readonly (click)="toggleDropdown('benefits', $event)"
            [ngClass]="{'border-red-500': jobForm.get('benefits')?.invalid && jobForm.get('benefits')?.touched}" />
          <!-- Dropdown -->
          <div class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg"
            [ngClass]="{'hidden': !benefitsDropdownOpen}">
            <div class="p-2 max-h-48 overflow-y-auto">
              <label *ngFor="let benefit of benefits; let i = index" class="flex items-center mb-1 cursor-pointer">
                <input type="checkbox" [checked]="benefit.selected" (change)="updateSelection('benefits', i)"
                  class="mr-2" />
                {{ benefit.benefitName }}
              </label>
            </div>
          </div>
          <small class="text-gray-500">
            Click vào ô để mở danh sách. Tích chọn nhiều quyền lợi.
          </small>
          <div *ngIf="jobForm.get('benefits')?.invalid && jobForm.get('benefits')?.touched"
            class="text-red-500 text-sm mt-1">
            Benefits selection is required
          </div>
          <input type="hidden" formControlName="benefits" />
        </div>


        <!-- Level (chỉ xem) -->
        <div class="relative" id="level-wrapper">
          <label class="block text-lg font-semibold mb-1">
            Level
            <span class="text-red-500">*</span>
          </label>
          <input 
            type="text" 
            [value]="getSelectedItemsText('level')"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2] cursor-pointer"
            placeholder="Click to select levels" 
            readonly
            (click)="toggleDropdown('level', $event)"
            [ngClass]="{'border-red-500': jobForm.get('level')?.invalid && jobForm.get('level')?.touched}"
          />
          <!-- Dropdown -->
          <div 
            class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg"
            [ngClass]="{'hidden': !levelDropdownOpen}"
          >
            <div class="p-2 max-h-48 overflow-y-auto">
              <label 
                *ngFor="let level of levels; let i = index"
                class="flex items-center mb-1 cursor-pointer"
              >
                <input 
                  type="checkbox" 
                  [checked]="level.selected"
                  (change)="updateSelection('level', i)" 
                  class="mr-2" 
                />
                {{ level.levelName }}
              </label>
            </div>
          </div>
          <small class="text-gray-500">
            Click vào ô để mở danh sách. Tích chọn nhiều cấp độ.
          </small>
          <div *ngIf="jobForm.get('level')?.invalid && jobForm.get('level')?.touched" class="text-red-500 text-sm mt-1">
            Level selection is required
          </div>
          <input type="hidden" formControlName="level" />
        </div>

        <!-- Description (chỉ đọc) -->
        <div class="md:col-span-2">
          <label for="description" class="block text-lg font-medium mb-1">
            Description
          </label>
          <textarea id="description" name="description" rows="4"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none"
            readonly>{{data.description}}</textarea>
        </div>
      </div>
    </ng-container>
    <ng-template #failed>
      <div class="text-red-500 text-lg font-semibold">
        Failed to load job details.
      </div>
    </ng-template>


    <div class="mt-8 flex justify-end">
      <!-- Save Changes -->
      <button type="submit" class="mr-4 bg-[#1976d2] text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
        Save Changes
      </button>
      <!-- Cancel -->
      <button type="button" routerLink="/admin/jobs"
        class="border border-[#1976d2] text-[#1976d2] bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
        Cancel
      </button>
    </div>
  </div>
</div>
