<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <!-- Tiêu đề -->
  <h1 class="text-4xl font-semibold mb-8">
    Edit Job
  </h1>

  <!-- Breadcrumb -->
  <div class="pb-8">
    <a routerLink="/admin/jobs" class="text-xl text-primary hover:underline" href="">Job List</a>
    >
    <a class="text-xl text-primary hover:underline" href="">Edit job</a>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <!-- Phần I: Job information -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-semibold">
        Job information
      </h2>
      <!-- Ví dụ hiển thị Created at -->
      <div class="text-sm text-gray-500">
        <p>Created at: 2025-03-20</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Job Title (cho phép sửa) -->
      <div>
        <label for="jobTitle" class="block text-lg font-semibold mb-1">
          Job title
          <span class="text-red-500">*</span>
        </label>
        <input type="text" id="jobTitle" name="jobTitle" placeholder="Type a title..."
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
          value="Senior Java Developer" />
      </div>

      <!-- Skills (multi-select dropdown, cho phép sửa) -->
      <div class="relative" id="skills-wrapper">
        <label class="block text-lg font-semibold mb-1">
          Skills
          <span class="text-red-500">*</span>
        </label>
        <input type="text" id="skillsInput"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer"
          placeholder="Click to select skills" readonly />
        <!-- Dropdown chứa danh sách checkbox -->
        <div id="skillsDropdown"
          class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg hidden">
          <div class="p-2 max-h-48 overflow-y-auto">
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Java" class="mr-2" onclick="updateSkillsSelected()" checked />
              Java
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Flutter" class="mr-2" onclick="updateSkillsSelected()" />
              Flutter
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Node.js" class="mr-2" onclick="updateSkillsSelected()" checked />
              Node.js
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="System design" class="mr-2" onclick="updateSkillsSelected()" />
              System design
            </label>
            <!-- ... Bổ sung thêm kỹ năng tuỳ ý ... -->
          </div>
        </div>
        <small class="text-gray-500">
          Click vào ô để mở danh sách. Tích chọn nhiều kỹ năng tuỳ ý.
        </small>
        <!-- Hidden -->
        <input type="hidden" name="skills" id="skillsHidden" />
      </div>

      <!-- Start Date (ví dụ readonly) -->
      <div>
        <label for="startDate" class="block text-lg font-semibold mb-1">
          Start Date
          <span class="text-red-500">*</span>
        </label>
        <input type="date" id="startDate" name="startDate"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none" value="2025-03-25" />
      </div>

      <!-- End Date (cho phép sửa) -->
      <div>
        <label for="endDate" class="block text-lg font-semibold mb-1">
          End Date
          <span class="text-red-500">*</span>
        </label>
        <input type="date" id="endDate" name="endDate"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
          value="2025-06-30" />
      </div>

      <!-- Salary range (From - To) -->
      <div>
        <label class="block text-lg font-semibold mb-1">
          Salary Range
        </label>
        <div class="flex gap-2">
          <label for="from" class="block text-sm content-center font-medium ">
            From
          </label>
          <input type="number" id="salaryFrom" name="salaryFrom" placeholder="From"
            class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
            value="1000" />
          <label for="to" class="block text-sm content-center font-medium ">
            to
          </label>
          <input type="number" id="salaryTo" name="salaryTo" placeholder="To"
            class="w-1/2 border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
            value="2000" />
        </div>
      </div>

      <!-- Working Address (cho phép sửa) -->
      <div>
        <label for="workingAddress" class="block text-lg font-semibold mb-1">
          Working address
        </label>
        <input type="text" id="workingAddress" name="workingAddress" placeholder="Type an address..."
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
          value="Ho Chi Minh City" />
      </div>

      <!-- Benefits (multi-select dropdown, cho phép sửa) -->
      <div class="relative" id="benefits-wrapper">
        <label class="block text-lg font-semibold mb-1">
          Benefits
          <span class="text-red-500">*</span>
        </label>
        <input type="text" id="benefitsInput"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer"
          placeholder="Click to select benefits" readonly />
        <!-- Dropdown -->
        <div id="benefitsDropdown"
          class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg hidden">
          <div class="p-2 max-h-48 overflow-y-auto">
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Health insurance" class="mr-2" onclick="updateBenefitsSelected()" checked />
              Health insurance
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Paid vacation" class="mr-2" onclick="updateBenefitsSelected()" />
              Paid vacation
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Lunch x3" class="mr-2" onclick="updateBenefitsSelected()" />
              Lunch x3
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Free parking" class="mr-2" onclick="updateBenefitsSelected()" checked />
              Free parking
            </label>
            <!-- ... -->
          </div>
        </div>
        <small class="text-gray-500">
          Click vào ô để mở danh sách. Tích chọn nhiều quyền lợi.
        </small>
        <input type="hidden" name="benefits" id="benefitsHidden" />
      </div>

      <!-- Level (multi-select dropdown, cho phép sửa) -->
      <div class="relative" id="level-wrapper">
        <label class="block text-lg font-semibold mb-1">
          Level
          <span class="text-red-500">*</span>
        </label>
        <input type="text" id="levelInput"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer"
          placeholder="Click to select levels" readonly />
        <!-- Dropdown -->
        <div id="levelDropdown"
          class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-md shadow-lg hidden">
          <div class="p-2 max-h-48 overflow-y-auto">
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Fresher" class="mr-2" onclick="updateLevelSelected()" />
              Fresher
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Junior" class="mr-2" onclick="updateLevelSelected()" />
              Junior
            </label>
            <label class="flex items-center mb-1 cursor-pointer">
              <input type="checkbox" value="Senior" class="mr-2" onclick="updateLevelSelected()" checked />
              Senior
            </label>
            <!-- ... -->
          </div>
        </div>
        <small class="text-gray-500">
          Click vào ô để mở danh sách. Tích chọn nhiều cấp độ.
        </small>
        <input type="hidden" name="level" id="levelHidden" />
      </div>

      <!-- Description (cho phép sửa) -->
      <div class="md:col-span-2">
        <label for="description" class="block text-lg font-semibold mb-1">
          Description
        </label>
        <textarea id="description" name="description" rows="4" placeholder="Type description"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">We are looking for a Senior Java Developer with Node.js experience.</textarea>
      </div>
    </div>

    <!-- Nút Save Changes / Cancel -->
    <div class="mt-8 flex justify-end">
      <!-- Save Changes -->
      <button type="submit" class="mr-4 bg-primary text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
        Save Changes
      </button>
      <!-- Cancel -->
      <button type="button" routerLink="/admin/jobs"
        class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
        Cancel
      </button>
    </div>
  </div>
</div>

<script>
  // 1) Skills
  const skillsInput = document.getElementById('skillsInput');
  const skillsDropdown = document.getElementById('skillsDropdown');
  const skillsHidden = document.getElementById('skillsHidden');

  skillsInput.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleDropdown(skillsDropdown);
  });

  // 2) Benefits
  const benefitsInput = document.getElementById('benefitsInput');
  const benefitsDropdown = document.getElementById('benefitsDropdown');
  const benefitsHidden = document.getElementById('benefitsHidden');

  benefitsInput.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleDropdown(benefitsDropdown);
  });

  // 3) Level
  const levelInput = document.getElementById('levelInput');
  const levelDropdown = document.getElementById('levelDropdown');
  const levelHidden = document.getElementById('levelHidden');

  levelInput.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleDropdown(levelDropdown);
  });

  // Đóng dropdown khi click ngoài
  document.addEventListener('click', (e) => {
    // Nếu click ngoài các wrapper => ẩn dropdown
    if (!document.getElementById('skills-wrapper')?.contains(e.target)) {
      skillsDropdown.classList.add('hidden');
    }
    if (!document.getElementById('benefits-wrapper')?.contains(e.target)) {
      benefitsDropdown.classList.add('hidden');
    }
    if (!document.getElementById('level-wrapper')?.contains(e.target)) {
      levelDropdown.classList.add('hidden');
    }
  });

  function toggleDropdown(dropdown) {
    if (dropdown.classList.contains('hidden')) {
      dropdown.classList.remove('hidden');
    } else {
      dropdown.classList.add('hidden');
    }
  }

  // Hàm cập nhật Skills
  function updateSkillsSelected() {
    const checkboxes = skillsDropdown.querySelectorAll('input[type="checkbox"]');
    let selectedValues = [];
    checkboxes.forEach((cb) => {
      if (cb.checked) {
        selectedValues.push(cb.value);
      }
    });
    skillsInput.value = selectedValues.join(', ');
    skillsHidden.value = selectedValues.join(',');
  }

  // Hàm cập nhật Benefits
  function updateBenefitsSelected() {
    const checkboxes = benefitsDropdown.querySelectorAll('input[type="checkbox"]');
    let selectedValues = [];
    checkboxes.forEach((cb) => {
      if (cb.checked) {
        selectedValues.push(cb.value);
      }
    });
    benefitsInput.value = selectedValues.join(', ');
    benefitsHidden.value = selectedValues.join(',');
  }

  // Hàm cập nhật Level
  function updateLevelSelected() {
    const checkboxes = levelDropdown.querySelectorAll('input[type="checkbox"]');
    let selectedValues = [];
    checkboxes.forEach((cb) => {
      if (cb.checked) {
        selectedValues.push(cb.value);
      }
    });
    levelInput.value = selectedValues.join(', ');
    levelHidden.value = selectedValues.join(',');
  }
</script>
