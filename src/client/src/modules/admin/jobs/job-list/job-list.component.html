<!-- Job list component -->
<div class="px-8 bg-gray-100">
  <div class="mx-auto bg-white p-8 rounded-lg shadow-md">

    <form [formGroup]="searchForm" class="flex flex-col md:flex-row md:items-center md:gap-4 mb-6">
      <input type="text" placeholder="Search" formControlName="keyword"
        class="border border-[#ccc] p-3 rounded w-full md:w-1/3 pr-10 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
        (input)="keywordChange()">
      <select formControlName="status" title="Status"
        class="border border-[#ccc] p-3 rounded w-full md:w-1/4 focus:outline-none focus:ring-2 focus:ring-[#1976d2] mt-2 md:mt-0"
        (change)="statusChange()">
        <option value="">-- Status --</option>
        <option *ngFor="let status of statusList" [value]="status.name">{{status.name}}</option>
      </select>
    </form>

    <div class="flex flex-col md:flex-row justify-end gap-4 mb-4">
      <button type="button" (click)="searchData()"
        class="bg-[#1976d2] hover:bg-[#1565c0] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">
        Search
      </button>
      <button routerLink="/admin/jobs/create"
        class="bg-[#1976d2] hover:bg-[#1565c0] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Add
        new</button>
      <input type="file" (change)="onFileSelected($event)" accept=".xlsx" style="display: none" #fileInput />
      <button (click)="fileInput.click()" [disabled]="isImporting"
        class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">
        {{ isImporting ? 'Importing...' : 'Import' }}
      </button>
    </div>   

    <!-- Table -->
    <app-table [data]="data" [columns]="columns" [isShowNumber]="true" [currentPage]="currentPage"
      [currentPageSize]="currentPageSize" [pageSizeOptions]="pageSizeOptions" (onPageChange)="onPageChange($event)"
      (onPageSizeChange)="onPageSizeChange($event)" (onView)="viewDetail($event)" (onEdit)="edit($event)"
      (onDelete)="delete($event)">
    </app-table>
  </div>
</div>
