<!-- Job list component -->
<div class="my-4 bg-gray-100">
  <div class="mx-auto bg-white p-8 rounded-lg shadow-md">

    <div class="flex items-center gap-4 mb-4 p-2 md:flex-row flex-col">
      <form
        [formGroup]="searchForm"
        class="flex flex-col md:flex-row md:items-center md:gap-4 mb-6 w-full"
      >
        <div class="relative w-full md:w-1/3">
          <input
            formControlName="keyword"
            type="text"
            placeholder="Search"
            class="border border-[#ccc] p-3 rounded w-full pr-10 focus:border-[#1976d2]"
            (change)="keywordChange()"
          />
          <i
            class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"
          ></i>
        </div>
        <select
          (change)="statusChange()"
          formControlName="status"
          title="statusSearch"
          class="border border-[#ccc] p-3 rounded w-full md:w-1/4 focus:border-[#1976d2] mt-2 md:mt-0"
        >
          <option value="">Status</option>
          <option *ngFor="let status of statusList" [value]="status.name">
            {{ status.name }}
          </option>
        </select>
      </form>
    </div>


    <div class="flex flex-col md:flex-row justify-end gap-4 mb-4">
      <button type="button" (click)="searchData()"
        class="bg-[#1976d2] hover:bg-[#1565c0] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">
        Search
      </button>
      <button routerLink="/admin/jobs/create" *ngIf="authService.hasRole(['ADMIN', 'MANAGER','RECRUITER'])"
        class="bg-[#1976d2] hover:bg-[#1565c0] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Add
        new</button>
      <input type="file" (change)="onFileSelected($event)" title="import" accept=".xlsx" class="hidden" #fileInput />
      <button (click)="fileInput.click()" [disabled]="isImporting"
        class="bg-[#1976d2] hover:bg-[#1565c0] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">
        {{ isImporting ? 'Importing...' : 'Import' }}
      </button>
    </div>

    <!-- Table -->
    <app-table [data]="data" [columns]="columns" [isShowNumber]="true" [currentPage]="currentPage"
      [currentPageSize]="currentPageSize" [pageSizeOptions]="pageSizeOptions" (onPageChange)="onPageChange($event)"
      (onPageSizeChange)="onPageSizeChange($event)" (onView)="viewDetail($event)" (onEdit)="edit($event)"
      (onDelete)="delete($event)">
    </app-table>
  </div>
</div>
