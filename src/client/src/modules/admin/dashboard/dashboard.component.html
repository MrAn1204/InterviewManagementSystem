<div class="flex justify-between md:flex-wrap">
  <app-bar-chart
    title="Candidate Chart by Week"
    label="Candidate"
    [realData]="candidateChartRealData"
    (monthYearChange)="onMonthYearCandidateSearchChanged($event)"
  ></app-bar-chart>
  <app-bar-chart
    title="Job Chart by Week"
    label="Job"
    [realData]="jobChartRealData"
    (monthYearChange)="onMonthYearJobSearchChanged($event)"
  ></app-bar-chart>
</div>
