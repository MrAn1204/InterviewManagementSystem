<div class="p-8 bg-gray-100">
  <div class="max-w-5xl mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">Offer List</h2>

    <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
      <div class="relative w-full md:w-1/3">
        <input type="text" placeholder="Search"
          class="border border-gray-300 p-3 rounded w-full pr-10 focus:outline-none focus:border-[#1976d2]">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
      </div>
      <select class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
        <option>Department</option>
        <option>HR</option>
        <option>Engineering</option>
        <option>Finance</option>
      </select>
      <select class="border border-gray-300 p-3 rounded w-full md:w-1/4 focus:outline-none focus:border-[#1976d2]">
        <option>Status</option>
        <option>Waiting for interview</option>
        <option>Open</option>
        <option>Interviewed</option>
        <option>Offered</option>
        <option>Rejected</option>
      </select>
    </div>

    <div class="flex flex-col md:flex-row justify-end gap-4 mb-4">
      <button class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:md:w-1/5 cursor-pointer">Search</button>
      <button routerLink="/admin/offers/create"
        class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:w-1/5 md:min-w-[100px] cursor-pointer">Add new</button>
      <button class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:md:w-1/5 cursor-pointer">Import</button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse">
        <thead>
          <tr class="*:p-4 *:border *:border-[#e0e0e0] bg-[#f5f5f5] text-gray-700 font-semibold text-left">
            <th>Candidate Name</th>
            <th>Email</th>
            <th>Approver</th>
            <th>Department</th>
            <th>Notes</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr class="*:p-4 *:border *:border-[#e0e0e0] even:bg-[#fafafa] hover:bg-gray-100">
            <td>John Doe</td>
            <td>john.doegmail.com</td>
            <td>Jane Smith</td>
            <td>HR</td>
            <td class="text-center">N/A</td>
            <td class="text-center text-[#d32f2f] font-semibold">Rejected</td>
            <td class="text-center space-x-2">
              <button class="text-blue-500 hover:text-blue-700 cursor-pointer" routerLink="/admin/offers/1/detail">
                <i class="fa-regular fa-eye"></i>
              </button>
              <button class="text-green-500 hover:text-green-700 cursor-pointer" routerLink="/admin/offers/1/edit">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex justify-end items-center mt-6 gap-4">
      <span class="text-gray-700 text-sm">10/60 rows</span>
      <div class="flex gap-2">
        <button class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer">&lt;</button>
        <button class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer">&gt;</button>
      </div>
    </div>
  </div>
</div>
