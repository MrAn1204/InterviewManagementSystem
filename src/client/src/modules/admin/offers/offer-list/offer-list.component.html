<div class="py-4 bg-gray-100">
  <div class=" mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-900">Offer List</h2>

    <div [formGroup]="searchForm" class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
      <div class="relative w-full md:w-1/3">
        <input formControlName="keyword" type="text" placeholder="Search" (change)="keywordChange()"
          class="border border-gray-300 p-3 rounded w-full pr-10 focus:outline-none focus:border-[#1976d2]">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
      </div>
      <select formControlName="departmentName" (change)="departmentChange()" class="border border-gray-300 p-3 rounded w-full md:w-1/3 focus:outline-none focus:border-[#1976d2]">
        <option value="" selected>Department</option>
        <option *ngFor="let department of departments" [value]="department.departmentName">
          {{ department.departmentName }}
        </option>
      </select>
      <select formControlName="status" (change)="statusChange()" class="border border-gray-300 p-3 rounded w-full md:w-1/3 focus:outline-none focus:border-[#1976d2]">
        <option value="" selected>Status</option>
        <option *ngFor="let status of statusList" [value]="status.name">
          {{ status.name }}
        </option>
      </select>
    </div>

    <div class="flex flex-col md:flex-row justify-end gap-4 mb-4">
      <button (click)="searchData()" class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Search</button>
      <button routerLink="/admin/offers/create"
        class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Add new</button>
      <button (click)="openExportModal()" class="bg-[#1976d2] text-white px-4 py-2 rounded font-semibold w-full md:w-auto cursor-pointer">Export</button>
    </div>

    <app-table
      [data]="data"
      [columns]="columns"
      [isShowNumber]="true"
      [currentPage]="currentPage"
      [currentPageSize]="currentPageSize"
      [pageSizeOptions]="pageSizeOptions"
      (onPageChange)="onPageChange($event)"
      (onPageSizeChange)="onPageSizeChange($event)"
      (onView)="viewDetail($event)"
      (onEdit)="edit($event)"
    >
    </app-table>

    <app-export-offer-modal 
      [isOpen]="isExportModalOpen" 
      (closeModal)="closeExportModal()">
    </app-export-offer-modal>

      <span class="text-gray-700 text-sm">10/60 rows</span>
      <div class="flex gap-2">
        <button class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer">&lt;</button>
        <button class="px-2 py-1 text-gray-700 rounded border border-gray-300 hover:bg-blue-500 cursor-pointer">&gt;</button>
      </div>
    </div> -->
  </div>
</div>
