<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <!-- Tiêu đề -->
  <h1 class="text-4xl font-semibold mb-8">
    Create Offer
  </h1>

  <!-- Breadcrumb -->
  <div class="pb-8">
    <a routerLink="/admin/offers" class="cursor-pointer text-xl text-[#1976d2] hover:underline" href="">Offer List</a>
    >
    <a class="cursor-pointer text-xl text-[#1976d2] hover:underline" href="">Create Offer</a>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <form action="#">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Candidate name -->
        <div class="md:col-span-2">
          <label for="candidatename" class="block text-lg font-semibold mb-1">
            Candidate
            <span class="text-red-500">*</span>
          </label>
          <select id="candidatename" [(ngModel)]="selectedCandidate"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let candidate of candidates" [value]="candidate.id">
              {{ candidate.fullName }}
            </option>
          </select>
        </div>

        <!-- Position -->
        <div>
          <label for="position" class="block text-lg font-semibold mb-1">
            Position
            <span class="text-red-500">*</span>
          </label>
          <!-- <select id="position"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select a position</option>
          </select> -->
          <select id="position" [(ngModel)]="selectedPosition"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let position of positions" [value]="position">
              {{ position }}
            </option>
          </select>
        </div>

        <!-- Approver -->
        <div>
          <label for="approver" class="block text-lg font-semibold mb-1">
            Approver
            <span class="text-red-500">*</span>
          </label>
          <select id="approver" [(ngModel)]="selectedApprover"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let approver of approvers" [value]="approver.id">
              {{ approver.fullName }}
            </option>
          </select>
        </div>

        <!-- Interview info -->
        <div>
          <label for="interview" class="block text-lg font-semibold mb-1">
            Interview info
          </label>
          <select id="interview" [(ngModel)]="selectedInterview"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let interview of interviews" [value]="interview.id">
              {{ interview.title }}
            </option>
          </select>
        </div>

        <!-- Status Offer -->
        <div>
          <label for="status" class="block text-lg font-semibold mb-1">
            Status
            <span class="text-red-500">*</span>
          </label>
          <select id="status" [(ngModel)]="selectedStatus"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="Waiting for approval">Waiting for approval</option>
            <option value="Approved offer">Approved offer</option>
            <option value="Rejected offer">Rejected offer</option>
            <option value="Waiting for response">Waiting for response</option>
            <option value="Accepted offer">Accepted offer</option>
            <option value="Declined offer">Declined offer</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <!-- Contract Period -->
        <div class="md:col-span-2">
          <label class="block text-lg font-semibold mb-1">
            Contract Period
            <span class="text-red-500">*</span>
          </label>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex items-center">
              <label for="from" class="block text-sm font-medium mr-2">
                From
              </label>
              <input type="datetime-local" id="from" name="from"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
            </div>
            <div class="flex items-center">
              <label for="to" class="block text-sm font-medium mr-2">
                To
              </label>
              <input type="datetime-local" id="to" name="to"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
            </div>
          </div>
        </div>

        <!-- Contract type -->
        <div>
          <label for="contracttype" class="block text-lg font-semibold mb-1">
            Contract type
            <span class="text-red-500">*</span>
          </label>
          <select id="contracttype" [(ngModel)]="selectedContractType"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option value="Trial 2 months">Trial 2 months</option>
            <option value="Trial 3 months">Trial 3 months</option>
            <option value="1 year">1 year</option>
            <option value="3 years">3 years</option>
            <option value="Unlimited">Unlimited</option>
          </select>
        </div>

        <!-- Level -->
        <div>
          <label for="level" class="block text-lg font-semibold mb-1">
            Level
            <span class="text-red-500">*</span>
          </label>
          <select id="level" [(ngModel)]="selectedLevel"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let level of levels" [value]="level.id">
              {{ level.levelName }}
            </option>
          </select>
        </div>

        <!-- Department -->
        <div>
          <label for="department" class="block text-lg font-semibold mb-1">
            Department
            <span class="text-red-500">*</span>
          </label>
          <select id="department" [(ngModel)]="selectedDepartment"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let department of departments" [value]="department.id">
              {{ department.name }}
            </option>
          </select>
        </div>

        <!-- Recruiter Owner -->
        <div>
          <label for="recruiter" class="block text-lg font-semibold mb-1">
            Recruiter Owner
            <span class="text-red-500">*</span>
          </label>
          <select id="recruiter" [(ngModel)]="selectedRecruiter"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option *ngFor="let recruiter of recruiterOwner" [value]="recruiter.id">
              {{ recruiter.fullName }}
            </option>
          </select>
        </div>

        <!-- Due date -->
        <div class="md:col-span-2">
          <label for="duedate" class="block text-lg font-semibold mb-1">
            Due date
            <span class="text-red-500">*</span>
          </label>
          <input type="datetime-local" id="duedate" name="duedate"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
        </div>

        <!-- Basic salary -->
        <div class="md:col-span-2">
          <label for="salary" class="block text-lg font-semibold mb-1">
            Basic salary
            <span class="text-red-500">*</span>
          </label>
          <input type="text" id="salary"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Enter basic salary" required />
        </div>

        <!-- Note -->
        <div class="md:col-span-2">
          <label for="note" class="block text-lg font-semibold mb-1">
            Note
          </label>
          <textarea id="note" rows="4"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type a note"></textarea>
        </div>
      </div>

      <!-- Nút Submit/Cancel -->
      <div class="mt-8 flex justify-end">
        <!-- Submit -->
        <button type="submit"
          class="cursor-pointer mr-4 bg-[#1976d2] text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
          Submit
        </button>
        <!-- Cancel -->
        <button type="button" routerLink="/admin/offers"
          class="cursor-pointer border border-[#1976d2] text-[#1976d2] bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
