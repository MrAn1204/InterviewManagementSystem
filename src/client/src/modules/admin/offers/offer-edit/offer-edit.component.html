<div class="container mx-auto max-w-screen-xl py-8 px-4">
  <!-- Tiêu đề -->
  <h1 class="text-4xl font-semibold mb-8">
    Edit Offer
  </h1>

  <!-- Breadcrumb -->
  <div class="pb-8">
    <a routerLink="/admin/offers" class="text-xl text-[#1976d2] hover:underline" href="">Offer List</a>
    >
    <a class="text-xl text-[#1976d2] hover:underline" href="">Edit Offer</a>
  </div>

  <!-- Card bao quanh form -->
  <div class="bg-white shadow-md hover:shadow-lg rounded-md p-8">
    <form action="#">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Candidate name -->
        <div class="md:col-span-2">
          <label for="candidatename" class="block text-lg font-semibold mb-1">
            Candidate
            <span class="text-red-500">*</span>
          </label>
          <select id="candidatename"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select Candidate Name</option>
          </select>
        </div>

        <!-- Position -->
        <div>
          <label for="position" class="block text-lg font-semibold mb-1">
            Position
            <span class="text-red-500">*</span>
          </label>
          <select id="position"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select a position</option>
          </select>
        </div>

        <!-- Approver -->
        <div>
          <label for="approver" class="block text-lg font-semibold mb-1">
            Approver
            <span class="text-red-500">*</span>
          </label>
          <select id="approver"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select an approver</option>
          </select>
        </div>

        <!-- Interview info -->
        <div class="md:col-span-2">
          <label for="interview" class="block text-lg font-semibold mb-1">
            Interview info
          </label>
          <select id="interview"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select an interview schedule title</option>
          </select>
        </div>

        <!-- Contract Period -->
        <div class="md:col-span-2">
          <label class="block text-lg font-semibold mb-1">
            Contract Period
            <span class="text-red-500">*</span>
          </label>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex items-center">
              <label for="from" class="block text-sm font-medium mr-2">
                From
              </label>
              <input type="datetime-local" id="from" name="from"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
            </div>
            <div class="flex items-center">
              <label for="to" class="block text-sm font-medium mr-2">
                To
              </label>
              <input type="datetime-local" id="to" name="to"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
            </div>
          </div>
        </div>

        <!-- Contract type -->
        <div>
          <label for="contracttype" class="block text-lg font-semibold mb-1">
            Contract type
            <span class="text-red-500">*</span>
          </label>
          <select id="contracttype"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select a type of contract</option>
          </select>
        </div>

        <!-- Level -->
        <div>
          <label for="level" class="block text-lg font-semibold mb-1">
            Level
            <span class="text-red-500">*</span>
          </label>
          <select id="level"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select a level</option>
          </select>
        </div>

        <!-- Department -->
        <div>
          <label for="department" class="block text-lg font-semibold mb-1">
            Department
            <span class="text-red-500">*</span>
          </label>
          <select id="department"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected>Select a department</option>
          </select>
        </div>

        <!-- Recruiter Owner -->
        <div>
          <label for="recruiter" class="block text-lg font-semibold mb-1">
            Recruiter Owner
            <span class="text-red-500">*</span>
          </label>
          <select id="recruiter"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]">
            <option selected></option>
          </select>
        </div>

        <!-- Due date -->
        <div class="md:col-span-2">
          <label for="duedate" class="block text-lg font-semibold mb-1">
            Due date
            <span class="text-red-500">*</span>
          </label>
          <input type="datetime-local" id="duedate" name="duedate"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]" />
        </div>

        <!-- Basic salary -->
        <div class="md:col-span-2">
          <label for="salary" class="block text-lg font-semibold mb-1">
            Basic salary
            <span class="text-red-500">*</span>
          </label>
          <input type="text" id="salary"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Enter basic salary" required />
        </div>

        <!-- Note -->
        <div class="md:col-span-2">
          <label for="note" class="block text-lg font-semibold mb-1">
            Note
          </label>
          <textarea id="note" rows="4"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
            placeholder="Type a note"></textarea>
        </div>
      </div>

      <!-- Nút Submit/Cancel -->
      <div class="mt-8 flex justify-end">
        <!-- Submit -->
        <button type="submit" class="mr-4 bg-[#1976d2] text-white font-semibold py-2 px-6 rounded-md hover:bg-[#125cb0]">
          Submit
        </button>
        <!-- Cancel -->
        <button type="button" routerLink="/admin/offers"
          class="border border-[#1976d2] text-[#1976d2] bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
<script>
  const skillsInput = document.getElementById('skillsInput');
  const skillsDropdown = document.getElementById('skillsDropdown');
  const skillsHidden = document.getElementById('skillsHidden');

  // Khi click vào input => toggle hiển thị dropdown
  skillsInput.addEventListener('click', (e) => {
    e.stopPropagation(); // Ngăn chặn việc click ra ngoài tắt dropdown ngay
    toggleSkillsDropdown();
  });

  // Đóng dropdown khi click ngoài
  document.addEventListener('click', (e) => {
    // Nếu click ngoài vùng "skills-wrapper" thì ẩn dropdown
    const skillsWrapper = document.getElementById('skills-wrapper');
    if (!skillsWrapper.contains(e.target)) {
      skillsDropdown.classList.add('hidden');
    }
  });

  function toggleSkillsDropdown() {
    if (skillsDropdown.classList.contains('hidden')) {
      skillsDropdown.classList.remove('hidden');
    } else {
      skillsDropdown.classList.add('hidden');
    }
  }

  // Hàm cập nhật danh sách kỹ năng đã chọn
  function updateSkillsSelected() {
    // Lấy tất cả checkbox trong dropdown
    const checkboxes = skillsDropdown.querySelectorAll('input[type="checkbox"]');
    let selectedValues = [];
    checkboxes.forEach((cb) => {
      if (cb.checked) {
        selectedValues.push(cb.value);
      }
    });
    // Cập nhật hiển thị trên ô input
    skillsInput.value = selectedValues.join(', ');
    // Cập nhật hidden input để submit
    skillsHidden.value = selectedValues.join(',');
  }
</script>
