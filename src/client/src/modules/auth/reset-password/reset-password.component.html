<main class="flex items-center justify-center min-h-screen p-4 bg-gray-100">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md overflow-hidden p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Reset Password</h2>
        <p class="text-sm text-gray-600 mb-6 text-center">Please enter your new password</p>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
                <label for="newPassword" class="block text-sm font-medium text-gray-700">New Password</label>
                <input type="password" id="newPassword" formControlName="newPassword" class="block w-full p-2 border border-gray-300 rounded-md" required>
            </div>

            <div class="mb-6">
                <label for="confirmNewPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirmNewPassword" formControlName="confirmNewPassword" class="block w-full p-2 border border-gray-300 rounded-md" required>
            </div>

            <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-500 hover:bg-blue-600">
                Reset Password
            </button>
        </form>
    </div>
</main>
