<div class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-lg shadow-md overflow-hidden p-6">
    <div class="flex items-center justify-center space-x-2 mb-6">
      <div class="bg-black text-white px-3 py-2 rounded-md font-bold">DEV</div>
      <h2 class="text-xl font-semibold">IMS Recruitment</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="login-username" class="block text-sm font-medium text-gray-700">Username</label>
        <div class="mt-1 relative rounded-md shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-user text-gray-400"></i>
          </div>
          <input type="text" id="login-username" formControlName="username"
            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md p-2 border"
            placeholder="Enter username" />
        </div>
        <p class="text-red-500 text-xs italic mt-1"
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          Username must be between 3-255 characters.
        </p>
      </div>

      <div class="mb-6">
        <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
        <div class="mt-1 relative rounded-md shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-lock text-gray-400"></i>
          </div>
          <input type="password" id="login-password" formControlName="password"
            class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md p-2 border"
            placeholder="••••••••" />
        </div>
      </div>

      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center">
          <input type="checkbox" id="remember-me" formControlName="rememberMe" class="h-4 w-4 text-primary" />
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">Remember me</label>
        </div>

        <div class="text-sm">
          <a routerLink="/forget-password" class="font-medium text-blue-600 hover:text-blue-500">Forget password?</a>
        </div>
      </div>

      <p *ngIf="form.invalid && form.touched" class="text-red-500 text-sm mb-4">Please fix the errors before submitting.
      </p>

      <button type="submit" [disabled]="form.invalid"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Login
      </button>
    </form>
  </div>
</div>
