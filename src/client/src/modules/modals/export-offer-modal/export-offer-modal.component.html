<div *ngIf="isOpen" (click)="close()"
  id="export-modal"
  class="fixed inset-0 bg-black/30 backdrop-blur-md flex items-center justify-center z-50"
>
  <div class="bg-white rounded-lg shadow-md p-6 w-full max-w-md relative">
    <h2 class="text-2xl text-center font-semibold text-gray-800 mb-4">
      Export Offer
    </h2>

    <!-- Close Button -->
    <button
      id="close-modal"
      class="absolute top-2 right-2 text-gray-500 hover:text-red-500 text-xl"
    >
      &times;
    </button>

    <div class="space-y-4">
      <!-- Start Date and Time -->
      <div>
        <label class="block font-medium text-gray-700 mb-1" for="start-date"
          >Thời gian bắt đầu</label
        >
        <div class="flex space-x-2">
          <div class="relative flex-1">
            <input
              title="start-date"
              type="date"
              id="start-date"
              [(ngModel)]="startDate"
              class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
      </div>

      <!-- End Date and Time -->
      <div>
        <label class="block font-medium text-gray-700 mb-1" for="end-date"
          >Thời gian kết thúc</label
        >
        <div class="flex space-x-2">
          <div class="relative flex-1">
            <input
              title="end-date"
              type="date"
              id="end-date"
              [(ngModel)]="endDate"
              class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
      </div>

      <!-- Submit & Cancel Buttons -->
      <div class="flex justify-center mt-2 space-x-4">
        <button (click)="exportOffer()"
          id="submit-button"
          class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded transition"
        >
          Submit
        </button>
        <button (click)="close()"
          id="cancel-button"
          class="bg-gray-300 text-black px-4 py-2 rounded hover:bg-gray-400"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
