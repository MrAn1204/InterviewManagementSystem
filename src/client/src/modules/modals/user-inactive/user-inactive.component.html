<!-- src/app/pages/user-inactive/user-inactive.component.html -->
<div class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-lg p-6 w-96">
    <h2 class="text-xl font-semibold mb-4">Confirm Inactivate</h2>
    <p class="mb-6">Are you sure you want to mark this user as inactive?</p>
    <div class="flex justify-end space-x-4">
      <button (click)="cancel()"
        class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
        Cancel
      </button>
      <button (click)="confirmInactive()" [disabled]="isProcessing"
        class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 disabled:opacity-50">
        {{ isProcessing ? 'Processing...' : 'Confirm' }}
      </button>
    </div>
  </div>
</div>
