<div class="modal-overlay">
  <div class="modal-content">
    <h2 class="text-xl font-semibold mb-4">
      {{ currentStatus ? 'Confirm Inactivate' : 'Confirm Activate' }}
    </h2>
    <p class="mb-6">
      Are you sure you want to mark this user as {{ currentStatus ? 'inactive' : 'active' }}?
    </p>
    <div class="flex justify-end space-x-4">
      <button (click)="cancel()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 cursor-pointer">
        Cancel
      </button>
      <button (click)="confirmToggleStatus()" [disabled]="isProcessing"
              class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 disabled:opacity-50 cursor-pointer">
        {{ isProcessing ? 'Processing...' : (currentStatus ? 'Confirm Inactivate' : 'Confirm Activate') }}
      </button>
    </div>
  </div>
</div>
