<div *ngIf="isOpen" class="fixed inset-0 bg-black/30 backdrop-blur-md flex items-center justify-center z-50">
    <div class="flex flex-col gap-4 bg-white w-96 px-4 py-8 rounded-lg shadow-lg text-center">
        <i class="fa-solid fa-circle-exclamation text-4xl text-red-500"></i>
        <p class="pb-2 break-words">Are you sure you want to {{action}} this {{entity}}?</p>
        <div class="modal-buttons flex flex-wrap *:w-2/5 justify-evenly">
            <button (click)="closePopup()" class="border border-primary text-primary bg-white font-semibold py-2 px-6 rounded-md hover:bg-[#e3f2fd]">No</button>
            <button (click)="confirmCancel()" class="mr-4 bg-red-500 text-white font-semibold py-2 px-6 rounded-md hover:bg-red-400">Yes</button>
        </div>
    </div>
</div>
