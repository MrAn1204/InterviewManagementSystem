<div class="w-full mt-4 bg-white p-6 rounded-lg shadow-md">
  <h4 class="text-lg font-semibold mb-4">{{ title }}</h4>

  <div class="mb-4">
    <div class="grid grid-cols-2 gap-4">
      <!-- Month -->
      <div>
        <label for="month" class="block text-gray-700 mb-1 font-medium"
          >Select Month:</label
        >
        <select
          (change)="emitMonthYearChange()"
          id="month"
          [formControl]="monthControl"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
        >
          <option *ngFor="let m of months" [value]="m.value">
            {{ m.label }}
          </option>
        </select>
      </div>

      <!-- Year -->
      <div>
        <label for="year" class="block text-gray-700 mb-1 font-medium"
          >Select Year:</label
        >
        <select
          (change)="emitMonthYearChange()"
          id="year"
          [formControl]="yearControl"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#1976d2]"
        >
          <option *ngFor="let y of years" [value]="y">{{ y }}</option>
        </select>
      </div>
    </div>
  </div>

  <canvas #chartCanvas></canvas>
</div>
